        {q:'電子メールで、日本語や画像、添付ファイルなど、テキスト以外のデータを扱えるようにするための規格はどれか。',opts:['SMTP','MIME','IMAP','DKIM'],ans:1,exp:'MIMEは、メールの形式を拡張する規格です。'}]}
 ]},
{title:'セキュリティ',icon:'🛡',lab:'sec',sum:'ネットワークを守る仕組み。ファイアウォール（iptablesコマンドで、ルールを書く・順番を直す）、DMZ、HTTPSと電子証明書、IDS・IPS・WAFを、操作しながら確かめる。',
 clear:'ファイアウォールのルール評価（上から順・最初に一致・暗黙の拒否）、DMZの考え方、HTTPS（電子証明書・公開鍵暗号と共通鍵暗号）、IDS／IPS／WAFの違いが身についた。',
 note:['ファイアウォール：ゾーンの境目で、通信を許可／拒否する。送信元・宛先のIPアドレス、ポート番号、プロトコルで判断する（パケットフィルタリング）','ルールは、上から順に評価し、最初に一致したルールを適用。どれにも一致しなければ拒否（暗黙の拒否）。許可する通信だけを書くのが基本','ステートフルインスペクション：行きの通信が許可されたら、その戻りの通信は自動で許可する','DMZ（非武装地帯）：インターネットに公開するサーバ（Web・メール・DNSなど）を置く、中間のゾーン。乗っ取られても、社内LANに被害を広げないため、DMZ→社内LANは、基本的に拒否する','TLS（HTTPS）：電子証明書でサーバが本物かを確認し、公開鍵暗号で共通鍵の材料を安全に渡し、以降は共通鍵暗号で、速く暗号化通信する','電子証明書：サーバの公開鍵・サイト名・有効期限に、認証局（CA）が電子署名をしたもの。ブラウザは、CAの署名・サイト名・有効期限を検証する','IDS：侵入を検知して通知（止めない）。IPS：検知して、遮断まで行う。どちらもネットワーク全体を監視','WAF：Webアプリケーションへの攻撃（SQLインジェクション、クロスサイトスクリプティングなど）を、HTTPの中身を見て防ぐ','多層防御：ファイアウォール、DMZ、IPS、WAF、暗号化…と、守りを何重にも重ねる'],
 steps:[
 {title:'ファイアウォール：通す通信を、コマンドで決める',focus:{dev:'fw',view:'rules'},
  enter:S=>{setM8(S,{},[scR('allow','lan','out','HTTP'),scR('allow','lan','out','HTTPS')]);},
  body:`<p>ネットワークは、インターネットのような<b>信用できない場所</b>と、会社の中のような<b>守りたい場所</b>に分けて考えます。その境目に置いて、<b>通す通信と、止める通信を決める</b>のが、<b>ファイアウォール</b>です。</p>
  <h3>何を見て、判断するか</h3><p>通信の<b>ヘッダ情報</b>（送信元・宛先のIPアドレス、ポート番号、プロトコル）を見て、ルールと照らし合わせます。これを<b>パケットフィルタリング</b>といいます。</p>
  <h3>この教材に出てくるサービス</h3>
  <table class="t"><tr><th>サービス</th><th>ポート</th><th>何をするものか</th></tr><tr><td>HTTP／HTTPS</td><td class="mono">80／443</td><td>Webページを見る（HTTPSは暗号化あり）</td></tr><tr><td>SSH</td><td class="mono">22</td><td>離れたサーバを、<b>暗号化して遠隔操作</b>する。<b>管理者だけが使う入口</b>なので、外に開けっぱなしにすると危険</td></tr><tr><td>DB</td><td class="mono">3306</td><td>データベースにアクセスする（MySQLの標準ポート）。<b>顧客情報など、大事なデータ</b>がある</td></tr></table>
  <h3>ファイアウォールの設定は、コマンドで行う</h3>
  <p>現場のファイアウォールは、<b>コマンドで設定する</b>ことが多い機器です。この教材では、Linuxに入っている<b>iptables</b>（アイピー・テーブルズ）という、ファイアウォールの設定コマンドを使います。右の「ファイアウォール」のターミナル（黒い画面）に、コマンドを入力します。<code>help</code> で、一覧が出ます。</p>
  <h3>まず、言葉を3つ</h3>
  <table class="t"><tr><th>言葉</th><th>意味</th></tr>
  <tr><td><b>インタフェース</b></td><td>機器の、ネットワークの<b>出入り口</b>（ケーブルをさす口）。ファイアウォールには、口が複数あり、<b>eth0</b>（イーサ・ゼロ）＝<b>社内LAN</b>側、<b>eth1</b>＝<b>インターネット</b>側、のように名前がついている</td></tr>
  <tr><td><b>FORWARD</b>（フォワード）</td><td>ファイアウォールを<b>通り抜けていく通信</b>の、ルールの<b>一覧表</b>の名前。ルールは、ここに書く</td></tr>
  <tr><td><b>policy</b>（ポリシー）</td><td>どのルールにも<b>一致しない</b>通信を、どうするか。<b>DROP（拒否）</b>にしておくのが基本。これが<b>暗黙の拒否</b></td></tr></table>
  <h3>ルールの書き方</h3>
  <p>1本のルールは、こう書きます。<b>「どこから入って、どこへ出る、何の通信を、許可（拒否）する」</b>です。</p>
  <p><code>iptables -A FORWARD -i eth0 -o eth1 -p tcp --dport 443 -j ACCEPT</code></p>
  <table class="t"><tr><th>部分</th><th>意味</th></tr>
  <tr><td><code>iptables</code></td><td>ファイアウォールを設定するコマンド</td></tr>
  <tr><td><code>-A FORWARD</code></td><td>FORWARDの表の、<b>いちばん下に追加</b>（Append：アペンド）</td></tr>
  <tr><td><code>-i eth0</code></td><td>通信が<b>入ってくる</b>口（in）＝社内LAN側</td></tr>
  <tr><td><code>-o eth1</code></td><td>通信が<b>出ていく</b>口（out）＝インターネット側</td></tr>
  <tr><td><code>-p tcp</code></td><td>プロトコル（protocol）。Webなどは<b>tcp</b></td></tr>
  <tr><td><code>--dport 443</code></td><td><b>宛先ポート番号</b>（destination port）＝443（HTTPS）</td></tr>
  <tr><td><code>-j ACCEPT</code></td><td>一致したら、どうするか。<b>ACCEPT＝許可</b>、<b>DROP＝拒否（破棄）</b></td></tr></table>
  <p>つまり上の1行は、<b>「社内LANからインターネットへの、HTTPS（443）を、許可する」</b>です。（<code>-i</code>や<code>-o</code>は、省略もできます。省略すると、「どの口でも」という意味になります）</p>
  <h3>ルールを見るコマンド</h3>
  <p><code>iptables -L FORWARD -n --line-numbers</code>：<code>-L</code>＝一覧を表示（List）、<code>-n</code>＝名前ではなく数字で表示、<code>--line-numbers</code>＝ルールに番号をつける。先頭の行に、<b>policy</b>が出ます。</p>
  <p>行きの通信を許可すると、その<b>戻りの通信は、自動で許可</b>されます（<b>ステートフルインスペクション</b>）。</p>
  <h3>やってみよう</h3>
  <ol><li>ターミナルで、<code>iptables -L FORWARD -n --line-numbers</code> を入力。いまのルール（2本）と、policy を読む。</li><li>「🧪 通信テスト」で、通信を試す（通信テストは、「誰が、誰に、何で通信するか」を試す道具です）。</li><li>許可されなかった通信を、<b>コマンドで許可</b>してみる。</li></ol><p>コマンドが長くて難しいときは、右の「<b>🧩 コマンドを組み立てる</b>」を使います。「どうする？／どこから／どこへ／何の通信？」を選ぶと、コマンドができあがり、「ターミナルに入力する」で、黒い画面に入ります。<b>Enterを押して実行するのは、自分</b>です。できあがった部品が、どの意味か、見比べて覚えましょう。</p>`,
  why:'「何でも通す」と、攻撃も入ってきます。<b>必要な通信だけを許可して、あとは拒否する</b>。これが、ネットワークを守る、最初の一歩です。そして、現場では、これを<b>コマンドで</b>書きます。',
  hint:['黒い画面をクリックして、<code>iptables -L FORWARD -n --line-numbers</code> と入力して、Enter。','「🧪 通信テスト」タブ。送信元「社内PC」、宛先「外部のユーザ」、サービス「HTTPS」で「通信してみる」。','送信元「外部のユーザ」、宛先「社内DBサーバ」、サービス「DB」で、試します。','送信元「社内PC」、宛先「外部のユーザ」、サービス「SSH」で試すと、拒否されます。許可するルールがないからです。','「🧩 コマンドを組み立てる」で、どうする？＝許可、入る口＝eth0、出る口＝eth1、通信＝SSH（22）を選んで、「ターミナルに入力する」→ Enter。手で打つなら：<code>iptables -A FORWARD -i eth0 -o eth1 -p tcp --dport 22 -j ACCEPT</code>。そのあと、同じ通信テストをもう一度。'],
  terms:[['ファイアウォール','ネットワークの境目で、通信を許可／拒否する仕組み'],['パケットフィルタリング','IPアドレスやポート番号で、通信を許可／拒否する方式'],['iptables','Linuxのファイアウォールを設定するコマンド'],['policy','どのルールにも一致しない通信の扱い。DROP（拒否）にするのが基本（暗黙の拒否）'],['ステートフルインスペクション','許可した通信の戻りを、自動で許可する方式']],
  fe:'「ファイアウォールは、パケットのヘッダ情報（IPアドレス・ポート番号など）で、通信を制御する」「許可されていない通信は、すべて拒否する」。<br>科目Bのセキュリティ分野でも、<b>ファイアウォールのルール表を読んで、この通信は許可されるか／拒否されるかを判断する</b>形式の問題が出題されることがあります。<b>上から順に見る → 最初に一致したもので決まる → どれにも一致しなければ拒否</b>、の順で読めば解けます。',
  todo:[{t:'ターミナルで、<code>iptables -L FORWARD -n --line-numbers</code> を実行して、ルールを見る',f:(S,c)=>sHas(S,c,'ipt-L',x=>true)},
        {t:'通信テスト：社内PC → 外部（HTTPS）は、<b>許可</b>される',f:(S,c)=>sHas(S,c,'sctest',x=>x.src==='pc'&&x.dst==='ext'&&x.svc==='HTTPS'&&x.res==='allow')},
        {t:'通信テスト：外部 → 社内DBサーバ（DB）は、<b>暗黙の拒否</b>で、拒否される',f:(S,c)=>sHas(S,c,'sctest',x=>x.src==='ext'&&x.dst==='db'&&x.res==='deny'&&x.rule===0)},
        {t:'通信テスト：社内PC → 外部（SSH）は、許可していないので、<b>拒否</b>される',f:(S,c)=>sHas(S,c,'sctest',x=>x.src==='pc'&&x.dst==='ext'&&x.svc==='SSH'&&x.res==='deny')},
        {t:'<b>コマンドで</b>、社内LAN → インターネットの、SSH（22）を<b>許可</b>する',f:(S,c)=>sHas(S,c,'ipt-A',x=>x.a==='allow'&&x.from==='lan'&&x.to==='out'&&x.svc==='SSH')},
        {t:'同じ通信テスト（社内PC → 外部、SSH）が、<b>許可</b>に変わる',f:(S,c)=>{const i=sFind(S,c,'ipt-A',x=>x.a==='allow'&&x.from==='lan'&&x.to==='out'&&x.svc==='SSH');return i>=0&&sFind(S,c,'sctest',x=>x.src==='pc'&&x.dst==='ext'&&x.svc==='SSH'&&x.res==='allow',i+1)>=0;}}],
  quiz:[{q:'ファイアウォールの説明として、適切なものはどれか。',opts:['ネットワークの境目で、通信を許可または拒否する','メールの宛先から、配送先のサーバを調べる','IPアドレスを、自動で割り当てる','データを暗号化して保存する'],ans:0,exp:'ファイアウォールは、ネットワークの境目で、ルールにもとづいて、通信を許可／拒否します。'},
        {q:'どのルールにも一致しない通信は、policy が DROP のとき、どうなるか。',opts:['許可される','拒否される（暗黙の拒否）','ルールの数が増える','ログにだけ残る'],ans:1,exp:'許可していない通信は、拒否されます。'},
        {q:'iptables -A FORWARD -i eth0 -o eth1 -p tcp --dport 443 -j ACCEPT の説明として、適切なものはどれか。（eth0＝社内LAN側、eth1＝インターネット側）',opts:['社内LANからインターネットへの、HTTPS（443）を許可する','インターネットから社内LANへの、HTTPS（443）を許可する','社内LANからインターネットへの、HTTP（80）を拒否する','すべての通信を拒否する'],ans:0,exp:'-i が入る口（eth0＝社内LAN）、-o が出る口（eth1＝インターネット）、--dport 443 が HTTPS、-j ACCEPT が許可です。'},
        {q:'iptables のルールで、「-j DROP」の意味として、適切なものはどれか。',opts:['通信を許可する','通信を拒否（破棄）する','ルールを削除する','ルールを、いちばん上に移動する'],ans:1,exp:'-j は、一致したときの動作。ACCEPT＝許可、DROP＝拒否（破棄）です。'},
        {q:'パケットフィルタリング型のファイアウォールが、通信の許可／拒否の判断に使う情報として、適切なものはどれか。',opts:['送信元・宛先のIPアドレスと、ポート番号','メールの本文','Webページのデザイン','ユーザの顔写真'],ans:0,exp:'IPアドレス、ポート番号、プロトコルなどの、ヘッダ情報を使います。'}]},
 {title:'ルールの順番：上から、最初に一致したもの',focus:{dev:'fw',view:'rules'},
  enter:S=>{setM8(S,{},[scR('deny','lan','out','any'),scR('allow','lan','out','HTTPS')]);},
  body:`<p>ルールは、<b>上から順に</b>調べられ、<b>最初に一致したルールで、判定が決まります</b>。それより下のルールは、見ません。だから、<b>ルールの順番</b>が、とても大切です。</p>
  <p>いまのルール表は、こうなっています。まず、ターミナルで <code>iptables -L FORWARD -n --line-numbers</code> を入力して、自分の目で確かめてください。</p><ol><li>社内LAN → インターネット：<b>すべて拒否</b>（DROP）</li><li>社内LAN → インターネット：HTTPSを許可（ACCEPT）</li></ol>
  <p>「HTTPSは許可しているはず」なのに、社内PCから、外部のHTTPSにつながりません。通信テストで<b>原因</b>を確かめて、直します。</p>
  <h3>順番を直すコマンド</h3>
  <p>前のステップの <code>-A</code> は、いつも<b>いちばん下</b>に追加します。上に入れたいときは、次のコマンドを使います。</p>
  <table class="t"><tr><th>コマンド</th><th>意味</th></tr>
  <tr><td><code>iptables -I FORWARD 1 …</code></td><td><b>1番目に挿入</b>（Insert：インサート）。もとの1番目以降は、<b>1つずつ下がる</b>。<code>…</code>の部分は、-A のときと同じ書き方（-i -o -p --dport -j）</td></tr>
  <tr><td><code>iptables -D FORWARD 番号</code></td><td>その番号のルールを<b>削除</b>（Delete：デリート）。<b>下のルールの番号は、繰り上がる</b></td></tr></table>
  <p>やること：HTTPSの許可を<b>1番目に挿入</b>して、通るようにします。すると、いらなくなった、<b>元のHTTPS許可</b>（下に下がって3番になる）が、<b>重複</b>して残ります。<code>-L</code>で番号を確かめて、<code>-D</code>で消しましょう。</p>`,
  why:'ルールの順番を間違えると、<b>許可したつもりの通信が、拒否されたまま</b>になります。実務でも、よくある設定ミスです。<b>細かい例外（許可）を上に、広い範囲（拒否）を下に</b>書くのが、基本です。',
  hint:['「🧪 通信テスト」で、送信元「社内PC」、宛先「外部のユーザ」、サービス「HTTPS」を試します。ルール1で拒否されます。','HTTPSの許可は、いま2番目。1番目に入れたいので、<code>-A</code>ではなく<code>-I FORWARD 1</code>を使います。','<code>iptables -I FORWARD 1 -i eth0 -o eth1 -p tcp --dport 443 -j ACCEPT</code>','もう一度、通信テスト。そのあと<code>iptables -L FORWARD -n --line-numbers</code>で、HTTPSの許可が2か所（1番と3番）あることを確認します。','<code>iptables -D FORWARD 3</code>'],
  terms:[['ルールの評価順','上から順に評価して、最初に一致したルールを適用する']],
  fe:'「ファイアウォールのルールは、上から順に評価し、最初に一致したルールが適用される」。順番を入れ替えると結果が変わる問題が出る。',
  todo:[{t:'通信テスト：社内PC → 外部（HTTPS）は、ルール1の<b>拒否</b>で、通らない',f:(S,c)=>sHas(S,c,'sctest',x=>x.src==='pc'&&x.dst==='ext'&&x.svc==='HTTPS'&&x.res==='deny'&&x.rule===1)},
        {t:'<b>コマンドで</b>、HTTPSの許可を、<b>1番目に挿入</b>する（<code>iptables -I FORWARD 1 …</code>）',f:(S,c)=>sHas(S,c,'ipt-I',x=>x.n===1&&x.a==='allow'&&x.from==='lan'&&x.to==='out'&&x.svc==='HTTPS')},
        {t:'同じ通信テストが、<b>許可</b>に変わる',f:(S,c)=>{const i=sFind(S,c,'ipt-I',x=>x.n===1&&x.svc==='HTTPS');return i>=0&&sFind(S,c,'sctest',x=>x.src==='pc'&&x.dst==='ext'&&x.svc==='HTTPS'&&x.res==='allow',i+1)>=0;}},
        {t:'重複して残った、3番のルールを、<b>削除</b>する（<code>iptables -D FORWARD 3</code>）',f:(S,c)=>{const i=sFind(S,c,'ipt-I',x=>x.n===1);return i>=0&&sFind(S,c,'ipt-D',x=>x.n===3,i+1)>=0;}}],
  quiz:[{q:'ファイアウォールのルールの評価について、適切なものはどれか。',opts:['すべてのルールを調べて、多数決で決める','上から順に調べ、最初に一致したルールを適用する','下から順に調べる','ランダムに選ぶ'],ans:1,exp:'上から順に調べ、最初に一致したルールで決まります。'},
        {q:'ルール1「社内LAN→インターネット：すべて拒否」、ルール2「社内LAN→インターネット：HTTPSを許可」の順で登録されている。社内PCからHTTPSで外部へ接続すると、どうなるか。',opts:['許可される','拒否される','ルール2が先に評価される','エラーでルールが消える'],ans:1,exp:'ルール1に最初に一致して、拒否されます。ルール2は評価されません。'},
        {q:'iptables -I FORWARD 1 … の説明として、適切なものはどれか。',opts:['ルールを、1番目に挿入する','ルールを、いちばん下に追加する','1番のルールを削除する','ルールを、すべて削除する'],ans:0,exp:'-I は挿入（Insert）。番号を指定した位置に入れ、もとのルールは1つずつ下がります。'},
        {q:'ルールの書き方として、適切なものはどれか。',opts:['広い範囲の拒否を上に、細かい許可を下に書く','細かい例外の許可を上に、広い範囲の拒否を下に書く','順番は結果に影響しない','許可ルールは、必ず最後に書く'],ans:1,exp:'例外（許可）を上に、広い拒否を下に書くのが基本です。'}]},
 {title:'DMZ：公開サーバを、どこに置くか',focus:{dev:'fw',view:'test'},
  enter:S=>{setM8(S,{showDmz:true,showWeb:true,showWebSrc:true,layout:'flat',t:{src:'web',dst:'db',svc:'DB'}},[scR('allow','out','lan','HTTP')]);},
  body:`<p>会社のWebサーバは、インターネットに<b>公開</b>します。つまり、<b>外から、誰でもアクセスできる</b>ので、攻撃を受けて<b>乗っ取られる危険が、いちばん高い</b>サーバです。</p>
  <p>もし、このWebサーバを<b>社内LANの中</b>に置いていたら、乗っ取った攻撃者は、<b>同じ社内LANの中</b>から、顧客情報の入った<b>社内DBサーバ</b>に、直接アクセスできてしまいます。ファイアウォールを通らないからです。</p>
  <h3>DMZ（非武装地帯）</h3>
  <p>そこで、インターネットと社内LANの間に、<b>DMZ</b>という<b>中間のゾーン</b>を作り、公開サーバ（Web・メール・DNSなど）を、そこに置きます。ファイアウォールの、3つ目の口<b>eth2</b>が、<b>DMZ側</b>です（eth0＝社内LAN、eth1＝インターネット、eth2＝DMZ）。<b>DMZ → 社内LAN の通信は、基本的に拒否</b>します。こうすると、DMZのサーバが乗っ取られても、<b>社内LANには、被害が広がりにくい</b>のです。</p>
  <p>policy が DROP なので、<b>「DMZ → 社内LAN」を許可するルールを書かなければ、自動で拒否</b>されます。</p>
  <h3>実験</h3>
  <p>いまのルールは、<code>iptables -L FORWARD -n --line-numbers</code> で確認できます（インターネット → 社内LAN の、HTTPを許可、の1本だけ）。</p>
  <ol><li>「公開Webサーバ」を<b>社内LANに置いた状態</b>で、「通信テスト」の、送信元<b>「公開Webサーバ（乗っ取られた場合）」</b>、宛先「社内DBサーバ」、サービス「DB」を試す → 通ってしまう</li><li>「公開Webサーバ」のタブで、<b>DMZに置く</b></li><li>同じ通信テストを試す → 拒否される</li><li>外部のユーザが、公開WebサーバにHTTPでアクセスできるか、試す → <b>拒否される</b>（eth1→eth2 を許可するルールが、まだないから）</li><li>ターミナルで、<b>eth1 → eth2 の、HTTP（80）を許可</b>するルールを追加して、もう一度試す → 通る</li></ol>`,
  why:'<b>「侵入されること」を前提に、被害を小さくする</b>。これが、セキュリティの大切な考え方です。守りを、何重にも重ねることを<b>多層防御</b>といいます。',
  hint:['「通信テスト」の送信元に、「公開Webサーバ（乗っ取られた場合）」があります。','同じゾーン（社内LAN）の中の通信は、ファイアウォールを通りません。','「公開Webサーバ」のタブで、「DMZに置く」を押します。','DMZに置いたあと、外部 → 公開Web（HTTP）を試すと、拒否されます。許可ルールがないからです。','インターネット側（eth1）から、DMZ側（eth2）への、HTTP（80）：<code>iptables -A FORWARD -i eth1 -o eth2 -p tcp --dport 80 -j ACCEPT</code>'],
  terms:[['DMZ','公開サーバを置く、インターネットと社内LANの間の、中間のゾーン'],['多層防御','守りを何重にも重ねる考え方']],
  fe:'「公開サーバはDMZに置く」「DMZから社内LANへの通信は、原則として拒否」。DMZを使った構成図の問題が、よく出る。',
  todo:[{t:'社内LANに置いた状態で、乗っ取られたWeb → 社内DB（DB）を試す：<b>通ってしまう</b>',f:(S,c)=>sHas(S,c,'sctest',x=>x.src==='web'&&x.dst==='db'&&x.layout==='flat'&&x.res==='allow')},
        {t:'公開Webサーバを<b>DMZ</b>に置く',f:(S,c)=>{const i=sFind(S,c,'sctest',x=>x.src==='web'&&x.dst==='db'&&x.layout==='flat'&&x.res==='allow');return i>=0&&sFind(S,c,'sclayout',x=>x.layout==='dmz',i+1)>=0;}},
        {t:'DMZに置いた状態で、乗っ取られたWeb → 社内DBを試す：<b>拒否</b>される',f:(S,c)=>sHas(S,c,'sctest',x=>x.src==='web'&&x.dst==='db'&&x.layout==='dmz'&&x.res==='deny')},
        {t:'DMZに置いた状態で、外部 → 公開Web（HTTP）を試す：まだルールがないので、<b>拒否</b>される',f:(S,c)=>sHas(S,c,'sctest',x=>x.src==='ext'&&x.dst==='web'&&x.svc==='HTTP'&&x.layout==='dmz'&&x.res==='deny')},
        {t:'<b>コマンドで</b>、インターネット → DMZ の、HTTP（80）を許可する',f:(S,c)=>sHas(S,c,'ipt-A',x=>x.a==='allow'&&x.from==='out'&&x.to==='dmz'&&x.svc==='HTTP')},
        {t:'外部 → 公開Web（HTTP）が、<b>許可</b>に変わる',f:(S,c)=>{const i=sFind(S,c,'ipt-A',x=>x.a==='allow'&&x.from==='out'&&x.to==='dmz'&&x.svc==='HTTP');return i>=0&&sFind(S,c,'sctest',x=>x.src==='ext'&&x.dst==='web'&&x.svc==='HTTP'&&x.layout==='dmz'&&x.res==='allow',i+1)>=0;}}],
  quiz:[{q:'DMZ（非武装地帯）の説明として、適切なものはどれか。',opts:['社内LANの中で、最も安全なゾーン','インターネットと社内LANの間に設けた、公開サーバを置くゾーン','ウイルスを隔離して保管するゾーン','暗号化専用のゾーン'],ans:1,exp:'公開サーバを置く、中間のゾーンです。'},
        {q:'公開Webサーバを、DMZに置く主な理由として、適切なものはどれか。',opts:['通信を速くするため','乗っ取られても、社内LANへ被害が広がりにくくするため','サーバの電気代を減らすため','メールを暗号化するため'],ans:1,exp:'公開サーバは、攻撃を受けやすい。DMZに置けば、社内LANへの被害を抑えられます。'},
        {q:'一般的に、DMZに置くサーバとして、適切なものはどれか。',opts:['顧客情報を保管するDBサーバ','社員の人事情報サーバ','インターネットに公開するWebサーバ','社内専用のファイルサーバ'],ans:2,exp:'外部に公開するサーバ（Web・メール・DNS）を、DMZに置きます。'},
        {q:'policy が DROP のファイアウォールで、DMZ側（eth2）から社内LAN側（eth0）への通信を許可するルールを、書かなかった。DMZのサーバから社内LANへの通信は、どうなるか。',opts:['拒否される','許可される','DMZのサーバだけは許可される','ルールが自動で追加される'],ans:0,exp:'どのルールにも一致しないので、policy DROP（暗黙の拒否）で拒否されます。'}]},
 {title:'HTTPSと電子証明書：盗聴を防ぎ、本物を確かめる',focus:{dev:'tls',view:'tls'},
  enter:S=>{setM8(S,{showDmz:true,showWeb:true,showTls:true,layout:'dmz'},[]);},
  body:`<p>ファイアウォールで守っても、<b>通信の途中</b>でのぞかれたら、情報は漏れます。そこで、通信そのものを<b>暗号化</b>します。Webの暗号化が<b>HTTPS</b>（HTTP＋<b>TLS</b>）です。</p>
  <p>HTTPSは、2つの問題を解決します。</p><ol><li><b>盗聴</b>：通信の中身が、のぞかれる → <b>暗号化</b>で、読めなくする</li><li><b>なりすまし</b>：相手が、偽のサーバかもしれない → <b>電子証明書</b>で、本物かを確かめる</li></ol>
  <h3>電子証明書</h3><p>サーバの<b>公開鍵</b>、サイト名、有効期限に、<b>認証局（CA）</b>という信頼できる機関が、<b>電子署名</b>をしたものです。ブラウザは、<b>CAの署名が正しいか／サイト名が合っているか／有効期限内か</b>を確かめます。1つでも違えば、警告を出します。</p>
  <h3>暗号化の方式</h3><table class="t"><tr><th>方式</th><th>特徴</th></tr><tr><td><b>公開鍵暗号</b></td><td>鍵が2つ（公開鍵と秘密鍵）。安全に渡せるが、<b>遅い</b></td></tr><tr><td><b>共通鍵暗号</b></td><td>鍵が1つ。<b>速い</b>が、鍵を相手に安全に渡す方法が必要</td></tr></table>
  <p>HTTPSは、両方を組み合わせます。<b>公開鍵暗号で、共通鍵の材料を安全に渡し、そのあとは、速い共通鍵暗号で、通信する</b>のです。</p>
  <p><b>実験</b>：①HTTPで、盗聴者がいるとき、何が見えるか。②HTTPSで、盗聴者がいるとき、何が見えるか。③HTTPSで、証明書に問題があると、どうなるか。④正しい証明書に戻すと、どうなるか。</p>`,
  why:'パスワードやカード番号を扱うサイトは、HTTPSが必須です。<b>鍵マーク（🔒）が付いているか</b>、<b>証明書の警告が出ていないか</b>を、見る習慣をつけましょう。',
  hint:['「HTTPS通信」のタブで、「通信方式：HTTP」、「盗聴者：いる」にして、「アクセスする」。','次に、「HTTPS」にして、同じように。盗聴者に見えるのは、意味の分からない文字列です。','「HTTPS」のまま、証明書を「有効期限切れ」などにして、アクセスします。ブラウザが、警告を出します。','証明書を「正しい証明書」に戻して、もう一度アクセスします。'],
  terms:[['TLS','通信を暗号化し、相手を確認するプロトコル。HTTPSは、HTTPをTLSで保護したもの'],['電子証明書','公開鍵とサイト名などに、認証局（CA）が電子署名をしたもの'],['認証局（CA）','電子証明書を発行する、信頼できる機関'],['公開鍵暗号','公開鍵と秘密鍵のペアを使う暗号。遅い'],['共通鍵暗号','1つの鍵で、暗号化と復号をする暗号。速い']],
  fe:'「HTTPSは、TLSで通信を暗号化する」「サーバ証明書は、CAの電子署名により、サーバの正当性を保証する」「公開鍵暗号で共通鍵を共有し、共通鍵暗号でデータを暗号化」。',
  todo:[{t:'<b>HTTP</b>で、盗聴者がいる状態でアクセスする：パスワードが<b>丸見え</b>',f:(S,c)=>sHas(S,c,'sctls',x=>x.proto==='http'&&x.eve&&x.eveSees==='plain')},
        {t:'<b>HTTPS</b>で、盗聴者がいる状態でアクセスする：<b>暗号化</b>されて読めない',f:(S,c)=>sHas(S,c,'sctls',x=>x.proto==='https'&&x.eve&&x.eveSees==='cipher')},
        {t:'HTTPSで、<b>証明書に問題</b>がある状態でアクセスする：ブラウザが<b>警告</b>',f:(S,c)=>sHas(S,c,'sctls',x=>x.proto==='https'&&x.cert!=='valid'&&x.status==='warn')},
        {t:'<b>正しい証明書</b>に戻して、アクセスする：🔒 安全な通信',f:(S,c)=>{const i=sFind(S,c,'sctls',x=>x.proto==='https'&&x.cert!=='valid'&&x.status==='warn');return i>=0&&sFind(S,c,'sctls',x=>x.proto==='https'&&x.status==='secure',i+1)>=0;}}],
  quiz:[{q:'HTTPSで、ブラウザが、サーバ証明書を検証する主な目的はどれか。',opts:['通信を速くするため','接続先のサーバが、本物であることを確認するため','Webページのデザインを確認するため','ユーザのIDを確認するため'],ans:1,exp:'証明書は、サーバが本物かを、CAの署名によって保証します。'},
        {q:'TLSによる暗号化通信の方法として、適切なものはどれか。',opts:['すべて公開鍵暗号で、データを暗号化する','公開鍵暗号で共通鍵の材料を安全に渡し、以降は共通鍵暗号でデータを暗号化する','暗号化せずに、証明書だけを送る','共通鍵を、そのまま平文で送る'],ans:1,exp:'公開鍵暗号は遅いので、共通鍵の共有にだけ使い、データは速い共通鍵暗号で暗号化します。'},
        {q:'ブラウザが、証明書の警告を出す原因として、適切でないものはどれか。',opts:['証明書の有効期限が切れている','証明書のサイト名と、アクセス先の名前が違う','信頼できる認証局（CA）の署名がない','Webページの文字が大きい'],ans:3,exp:'警告の原因は、CAの署名・サイト名・有効期限などの問題です。'}]},
 {title:'IDS・IPS・WAF：許可された通信の中の攻撃',focus:{dev:'ids',view:'ids'},
  enter:S=>{setM8(S,{showDmz:true,showWeb:true,showIds:true,layout:'dmz'},[scR('allow','out','dmz','HTTP')]);},
  body:`<p>ファイアウォールは、<b>ポート番号</b>などで判断します。公開Webサーバの<b>ポート80（HTTP）は、許可</b>されています。では、そのHTTPの通信に<b>攻撃が混ざっていたら</b>？ファイアウォールは、通してしまいます。</p>
  <p>そこで、通信の<b>中身</b>まで見る装置を、追加します。</p>
  <table class="t"><tr><th>装置</th><th>やること</th><th>得意分野</th></tr>
  <tr><td><b>IDS</b>（侵入検知システム）</td><td>攻撃を<b>検知</b>して、管理者に<b>通知</b>する。通信は<b>止めない</b></td><td>ネットワーク全体の監視</td></tr>
  <tr><td><b>IPS</b>（侵入防御システム）</td><td>検知して、<b>遮断</b>まで行う</td><td>ネットワーク全体の監視</td></tr>
  <tr><td><b>WAF</b>（Webアプリケーションファイアウォール）</td><td>HTTPの中身を見て、<b>Webアプリへの攻撃</b>を遮断する</td><td>SQLインジェクション、クロスサイトスクリプティングなど</td></tr></table>
  <p><b>SQLインジェクション</b>とは、Webの入力欄に、<b>不正なSQL文</b>を入れて、データベースの情報を盗んだり、書き換えたりする攻撃です。</p>
  <p>防御装置を切り替えて、<b>攻撃を送り</b>、結果を比べましょう。</p>`,
  why:'<b>IDSは「見張り」、IPSは「見張り＋門番」</b>。ただし、どの装置にも<b>得意・不得意</b>があります。「どの攻撃に、どの装置が効くか」を考えるのが、選び方のコツです。',
  hint:['「攻撃と防御装置」のタブで、防御装置「なし」のまま、「SQLインジェクション」を送ります。','「IDS」に切り替えて、同じ攻撃。警報は出ますが、攻撃は成功します。','「WAF」に切り替えて、SQLインジェクション。防げます。','「OSの脆弱性を突く通信」は、WAFでは見逃し、IPSなら防げます。'],
  terms:[['IDS','侵入検知システム。検知して通知するだけ'],['IPS','侵入防御システム。検知して、遮断まで行う'],['WAF','Webアプリケーションへの攻撃を防ぐ装置'],['SQLインジェクション','入力欄に不正なSQL文を入れて、DBを不正に操作する攻撃']],
  fe:'「IDSは検知（通知）、IPSは検知＋遮断」「SQLインジェクションなど、Webアプリの脆弱性を突く攻撃には、WAF」。',
  todo:[{t:'防御装置「なし」で、<b>SQLインジェクション</b>を送る：攻撃が成功してしまう',f:(S,c)=>sHas(S,c,'scatk',x=>x.atk==='sqli'&&x.d==='none'&&x.out==='damage')},
        {t:'<b>IDS</b>で、SQLインジェクション：警報は出るが、<b>止まらない</b>',f:(S,c)=>sHas(S,c,'scatk',x=>x.atk==='sqli'&&x.d==='ids'&&x.out==='damage'&&x.alert)},
        {t:'<b>WAF</b>で、SQLインジェクション：<b>防げる</b>',f:(S,c)=>sHas(S,c,'scatk',x=>x.atk==='sqli'&&x.d==='waf'&&x.out==='blocked')},
        {t:'<b>WAF</b>で、「OSの脆弱性を突く通信」：<b>見逃す</b>',f:(S,c)=>sHas(S,c,'scatk',x=>x.atk==='exploit'&&x.d==='waf'&&x.out==='damage')},
        {t:'<b>IPS</b>で、「OSの脆弱性を突く通信」：<b>防げる</b>',f:(S,c)=>sHas(S,c,'scatk',x=>x.atk==='exploit'&&x.d==='ips'&&x.out==='blocked')}],
  quiz:[{q:'IDSとIPSの違いとして、適切なものはどれか。',opts:['IDSは攻撃を検知して通知し、IPSは検知に加えて遮断も行う','IDSは遮断し、IPSは通知だけを行う','IDSは暗号化し、IPSは復号する','違いはない'],ans:0,exp:'IDSは検知・通知、IPSは検知・遮断です。'},
        {q:'Webアプリケーションの入力欄を悪用して、データベースの情報を盗む「SQLインジェクション」への対策として、特に有効な装置はどれか。',opts:['WAF','DHCPサーバ','NAT','スイッチ'],ans:0,exp:'WAFは、HTTPの中身を見て、Webアプリへの攻撃を防ぎます。'},
        {q:'ファイアウォールでポート80を許可している。その通信に混ざった、SQLインジェクションを、ファイアウォールは防げるか。',opts:['防げる','防げない。ポート番号が許可されていると、中身までは見ない','防げる。SQL文は、必ず拒否される','サーバが再起動する'],ans:1,exp:'ファイアウォールは、ポート番号などで判断し、通信の中身までは見ません。だから、WAFなどを追加します。'}]},
 {title:'チャレンジ：「Webが乗っ取られて、顧客情報が漏れた」を直す',blind:true,focus:{dev:'fw',view:'rules'},
  enter:S=>{setM8(S,{showDmz:true,showWeb:true,showWebSrc:true,edit:true,layout:'flat'},[scR('allow','out','lan','any')]);},
  body:`<p>公開Webサーバが乗っ取られ、社内DBサーバの<b>顧客情報が漏れました</b>。原因は、「<b>ルールが緩すぎる</b>」ことと、「<b>Webサーバの置き場所が、まずい</b>」ことでした。再発しないように、直してください。</p>
  <p>次の4つの条件を、<b>すべて</b>満たすようにします。（上の「やってみよう」の項目が、すべてチェックされれば、OKです）</p>
  <ul><li>外部のユーザが、公開Webに<b>HTTPSで</b>アクセスできる</li><li>外部から、公開Webへの<b>SSH</b>（管理者用の遠隔操作）は、使えない</li><li>外部から、社内DBへは、届かない</li><li>万一、公開Webが乗っ取られても、<b>社内DBには、届かない</b></li></ul>
  <p>使える操作は、「ファイアウォール」のターミナルでの<b>iptablesコマンド</b>（<code>-L</code>・<code>-A</code>・<code>-I</code>・<code>-D</code>）と、「公開Webサーバ」の<b>置き場所の変更</b>です。まず <code>iptables -L FORWARD -n --line-numbers</code> で、いまのルールを読みましょう。</p>`,
  why:'「必要な通信だけを許可する」「公開サーバは、DMZに置く」。この2つを守るだけで、被害は、大きく減ります。',
  hint:['「通信テスト」で、4つの条件を、1つずつ試します。最初は、ほとんど満たしていません。','ターミナルで <code>iptables -L FORWARD -n --line-numbers</code>。いまのルールは、「eth1（インターネット）→ eth0（社内LAN）：すべて許可」。広すぎます。<code>iptables -D FORWARD 番号</code> で削除します。','「公開Webサーバ」のタブで、「DMZに置く」に変更します。社内LANの中では、ファイアウォールを通りません。','インターネット（eth1）から、DMZ（eth2）への、HTTPS（443）を許可：<code>iptables -A FORWARD -i eth1 -o eth2 -p tcp --dport 443 -j ACCEPT</code>'],
  terms:[],
  fe:'「許可は、必要最小限に」「公開サーバはDMZに置き、DMZから社内LANへの通信は原則拒否」。',
  todo:[{t:'外部 → 公開Web（HTTPS）が、<b>許可</b>される',f:(S,c)=>sNow(S,'ext','web','HTTPS','allow')},
        {t:'外部 → 公開Web（SSH）が、<b>拒否</b>される',f:(S,c)=>sNow(S,'ext','web','SSH','deny')},
        {t:'外部 → 社内DB（DB）が、<b>拒否</b>される',f:(S,c)=>sNow(S,'ext','db','DB','deny')},
        {t:'乗っ取られた公開Web → 社内DB（DB）が、<b>拒否</b>される',f:(S,c)=>sNow(S,'web','db','DB','deny')}],
  quiz:[{q:'今回の対策として、適切な組み合わせはどれか。',opts:['公開WebサーバをDMZに置き、必要な通信（HTTPS）だけを許可する','公開Webサーバを社内LANの奥に置き、すべての通信を許可する','ファイアウォールのルールを、すべて削除する','社内DBサーバを、DMZに移す'],ans:0,exp:'公開サーバは、DMZに置き、必要な通信だけを許可します。'}]},
 {title:'まとめ問題（基本情報・科目Aスタイル）',body:`<p>ミッション8の総仕上げです。</p>`,
  past:'過去問題サイト「<a href=\"https://www.fe-siken.com/\" target=\"_blank\" rel=\"noopener\">基本情報技術者試験.com</a>」（別タブで開きます）などで、科目Aの「セキュリティ」分野の問題を探して解いてみましょう。公式の過去問題は、IPA（情報処理推進機構）も公開しています。<br><b>探すキーワード</b>：ファイアウォール／DMZ／パケットフィルタリング／IDS／IPS／WAF／SQLインジェクション／TLS／電子証明書／認証局（CA）／公開鍵暗号／共通鍵暗号／多層防御<br>間違えた選択肢の用語は、右上の「📒 学習ノート」と見比べると定着します。<br><span class=\"small\">※ 過去問の問題文は著作権があるため、このアプリには転載していません。上のまとめ問題は、出題されやすいパターンをもとにしたオリジナル問題です。分野名や掲載ページは改定で変わることがあるので、公式サイトで確認してください。</span>',
  quiz:[{q:'ファイアウォールのルールが、上から順に評価され、最初に一致したルールが適用されるとき、どのルールにも一致しない通信は、どう扱うのが一般的か。',opts:['許可する','拒否する','ログだけ残して許可する','別のルールを自動で作る'],ans:1,exp:'許可していない通信は、拒否します（暗黙の拒否）。'},
        {q:'インターネットに公開するWebサーバやメールサーバを、社内LANから分離して設置する、中間のネットワークはどれか。',opts:['VLAN','DMZ','VPN','NAT'],ans:1,exp:'DMZです。乗っ取られても、社内LANに被害が広がりにくくなります。'},
        {q:'IDSとIPSの説明として、適切なものはどれか。',opts:['IDSは通信を遮断し、IPSは通知のみ行う','IDSは侵入を検知して通知し、IPSは検知に加えて遮断も行う','どちらも、暗号化を行う','どちらも、IPアドレスを変換する'],ans:1,exp:'IDS＝検知、IPS＝検知＋防御です。'},
        {q:'サーバ証明書の役割として、適切なものはどれか。',opts:['通信を高速化する','認証局（CA）の電子署名により、サーバの正当性を保証する','パスワードを平文で保存する','Webページを圧縮する'],ans:1,exp:'サーバ証明書は、CAが署名し、サーバが本物であることを保証します。'},
        {q:'Webアプリケーションの脆弱性を突く、SQLインジェクションなどの攻撃を防ぐために、HTTPの内容を検査して遮断する装置はどれか。',opts:['WAF','スイッチ','DNSサーバ','プロキシサーバ'],ans:0,exp:'WAFは、Webアプリケーションへの攻撃を防ぎます。'}]}
 ]},
{title:'総合演習',icon:'🧰',lab:'tb',sum:'ここまでの8ミッションの総仕上げ。「ネットにつながらない」「サイトが開けない」という症状から、コマンドで原因を切り分け、ルータ・スイッチ・FW・DNS・Webサーバを、コマンドで直す。実際の現場と同じ流れで進めます。',
 clear:'「自分の設定 → ゲートウェイ → 外部のIPアドレス → 名前解決 → アプリ（ポート）」の順に切り分ける考え方と、PC・スイッチ・ルータ・FW・DNS・Webサーバを、コマンドで確認・設定する基本が身についた。',
 note:['切り分けの順番：①ipconfig（自分の設定）→ ②ping ゲートウェイ → ③ping 外部のIPアドレス → ④nslookup（名前解決）→ ⑤curl（ページの取得）。止まった場所が、原因のある場所','ping でゲートウェイにも届かない：IP設定、スイッチのVLAN、ケーブル。外部IPだけ届かない：デフォルトゲートウェイ、ルータのデフォルトルート、NAT、FW','「宛先ホストに到達できません」＝自分（PC）が出す。「宛先ネットワークに到達できません」＝ルータが出す（ルートがない）。「要求がタイムアウト」＝返事がない（NAT・FW・相手が停止など）','nslookup が失敗：PCのDNSサーバ設定、DNSサーバの停止、レコードの誤り、FWでUDP53が拒否','curl の失敗：「接続が拒否」＝届いたがそのポートで待ち受けていない。「タイムアウト」＝途中（FW・経路）で止まっている','Linuxのサービスは、設定ファイルを書き換えただけでは反映されない。reload／restart が必要','iptables：ルールは上から評価し、最初に一致したものを適用。どれにも一致しなければ、policy（DROP）に従う'],

 steps:[
 {title:'ネットワーク構成と、コマンド辞書',focus:{dev:'pcA',view:'term'},
  enter:S=>{setTb(S);},
  body:`<p>総合演習は、これまでの8ミッションの総仕上げです。次のステップからは、<b>「ネットが使えません」という、問い合わせ（症状）だけ</b>が示されます。<b>原因は書かれていません</b>。コマンドで調べて、原因を見つけ、コマンドで直します。</p>
  <p>このステップは、そのための<b>準備</b>です。①ネットワークの構成と、正常な設定値、②切り分けの順番、③コマンド辞書を、確認します。<b>辞書は、いつでも、ここに戻って見られます</b>。</p>
  <h3>① 構成と、正常な設定値（基準）</h3>
  <table class="t"><tr><th>機器</th><th>正常な設定</th></tr>
  <tr><td>💻 PC-A</td><td>IPアドレス 192.168.1.11／マスク 255.255.255.0／ゲートウェイ 192.168.1.1／DNSサーバ 198.51.100.53</td></tr>
  <tr><td>🔀 スイッチ</td><td>Fa0/1にPC-A、Fa0/2にルータ。<b>どちらもVLAN10</b></td></tr>
  <tr><td>📡 ルータ</td><td>LAN側 192.168.1.1／WAN側 203.0.113.2。ISPのルータ（203.0.113.1）へのデフォルトルートと、NAPTが設定されている</td></tr>
  <tr><td>🧱 FW</td><td>ルータの外側。通信は、基本的に拒否（policy DROP）で、<b>ICMP（ping）、UDP 53（DNS）、TCP 80（HTTP）、TCP 443（HTTPS）</b>を許可</td></tr>
  <tr><td>📖 DNSサーバ</td><td>198.51.100.53（Linux、named）。<b>www.example.test → 198.51.100.80</b></td></tr>
  <tr><td>🖥 Webサーバ</td><td>198.51.100.80（Linux、nginx）。<b>80番</b>で待ち受け</td></tr></table>
  <h3>② 切り分けの順番</h3>
  <p>原因は、あちこちにありえます。<b>自分に近いところから、順に確かめて</b>、<b>どこで止まったか</b>を見つけます。止まった場所の<b>近く</b>に、原因があります。</p>
  <table class="t"><tr><th>順</th><th>確かめること</th><th>コマンド</th></tr>
  <tr><td>①</td><td>自分のIP設定</td><td><code>ipconfig /all</code></td></tr>
  <tr><td>②</td><td>ゲートウェイ（LANの出口）に届くか</td><td><code>ping 192.168.1.1</code></td></tr>
  <tr><td>③</td><td>外のIPアドレスに届くか</td><td><code>ping 198.51.100.80</code>、どこまで届くかは <code>tracert 198.51.100.80</code></td></tr>
  <tr><td>④</td><td>名前からIPアドレスが分かるか</td><td><code>nslookup www.example.test</code></td></tr>
  <tr><td>⑤</td><td>Webページが取得できるか</td><td><code>curl http://www.example.test</code></td></tr></table>
  <h3>③ コマンド辞書</h3>
  <p><b>💻 PC-A（Windows）</b>：調べる＋IP設定を変える</p>
  <table class="t"><tr><th>コマンド</th><th>意味</th></tr>
  <tr><td><code>ipconfig /all</code></td><td>自分のIPアドレス・マスク・ゲートウェイ・DNSサーバを表示</td></tr>
  <tr><td><code>ping 宛先</code></td><td>届くか確認（宛先は、IPアドレスか、名前）</td></tr>
  <tr><td><code>tracert 宛先</code></td><td>宛先までの経路（ルータ）を、順に表示</td></tr>
  <tr><td><code>nslookup 名前</code></td><td>DNSサーバに聞いて、名前からIPアドレスを調べる</td></tr>
  <tr><td><code>curl http://宛先[:ポート]</code></td><td>Webページを取得する</td></tr>
  <tr><td><code>netsh interface ip set address name="Ethernet" static IP マスク ゲートウェイ</code></td><td>IPアドレス・マスク・ゲートウェイを設定。<b>IP → マスク → ゲートウェイ</b>の順に書く</td></tr>
  <tr><td><code>netsh interface ip set dns name="Ethernet" static DNSサーバのIP</code></td><td>DNSサーバを設定</td></tr></table>
  <p><b>🔀 スイッチ・📡 ルータ（Cisco風）</b>：<b>モード</b>があります。設定は、<code>conf t</code> で設定モードに入り、終わったら <code>end</code>。設定を消すときは、同じコマンドの前に <code>no</code>。</p>
  <table class="t"><tr><th>機器</th><th>コマンド</th><th>意味</th></tr>
  <tr><td>スイッチ</td><td><code>show vlan brief</code></td><td>VLANと、所属するポートの一覧</td></tr>
  <tr><td>スイッチ</td><td><code>conf t</code> → <code>int fa0/1</code> → <code>switchport access vlan 番号</code> → <code>end</code></td><td>ポート（Fa0/1）を選んで、所属するVLANを変える</td></tr>
  <tr><td>ルータ</td><td><code>show ip route</code></td><td>ルーティングテーブル。「Gateway of last resort」＝デフォルトルート</td></tr>
  <tr><td>ルータ</td><td><code>show ip nat translations</code></td><td>NATの変換表</td></tr>
  <tr><td>ルータ</td><td><code>ip route 0.0.0.0 0.0.0.0 次の転送先</code></td><td>デフォルトルートを追加（設定モード内）</td></tr>
  <tr><td>ルータ</td><td><code>ip nat inside source list 1 interface gigabitethernet0/1 overload</code></td><td>NAPTを有効にする（設定モード内）</td></tr></table>
  <p><b>🧱 FW（Linux：iptables）</b>：ルータの内側と外側の間を通る通信は、<b>FORWARD</b>というルール表で決まります。ルールは<b>上から順に</b>評価し、どれにも一致しなければ、<b>policy</b>に従います。</p>
  <table class="t"><tr><th>コマンド</th><th>意味</th></tr>
  <tr><td><code>iptables -L FORWARD -n --line-numbers</code></td><td>ルールを、番号つきで表示</td></tr>
  <tr><td><code>iptables -A FORWARD -p tcp --dport 443 -j ACCEPT</code></td><td>ルールを、最後に追加（<code>-p</code>：プロトコル、<code>--dport</code>：宛先ポート、<code>-j</code>：ACCEPT＝許可／DROP＝拒否）</td></tr>
  <tr><td><code>iptables -I FORWARD 1 …</code></td><td>ルールを、1番目に挿入</td></tr>
  <tr><td><code>iptables -D FORWARD 番号</code></td><td>その番号のルールを削除</td></tr></table>
  <p><b>📖 DNSサーバ・🖥 Webサーバ（Linux）</b></p>
  <table class="t"><tr><th>コマンド</th><th>意味</th></tr>
  <tr><td><code>cat ファイル名</code></td><td>ファイルの中身を表示。DNS：<code>/var/named/example.test.zone</code>、Web：<code>/etc/nginx/conf.d/site.conf</code></td></tr>
  <tr><td><code>sed -i 's/旧/新/' ファイル名</code></td><td>ファイルの中の、<b>旧</b>を<b>新</b>に置き換える</td></tr>
  <tr><td><code>systemctl status|start|stop|reload|restart サービス名</code></td><td>サービス（DNSは <code>named</code>、Webは <code>nginx</code>）の状態確認・起動・停止・再読み込み・再起動</td></tr>
  <tr><td><code>ss -tln</code>（Web）</td><td>待ち受けているポートの一覧</td></tr></table>
  <div class="box why"><b>⚠ 大事なこと</b>　Linuxでは、設定ファイルを書き換えただけでは、<b>動いているサービスには、反映されません</b>。<code>reload</code> か <code>restart</code> が必要です。</div>
  <p>最後に、<b>正常なネットワークで、5つのコマンドを実行</b>して、「正常なときの表示」を見ておきましょう。</p>`,
  why:'「どこが壊れているか」は、<b>正常な状態を知っている</b>から、分かります。正常なときの表示を、よく見ておきましょう。',
  hint:['PC-Aのターミナルで <code>ipconfig /all</code>。','<code>ping 192.168.1.1</code>（ゲートウェイ）、<code>ping 198.51.100.80</code>（Webサーバ）。','<code>tracert 198.51.100.80</code>、<code>nslookup www.example.test</code>、<code>curl http://www.example.test</code>。'],
  terms:[['デフォルトゲートウェイ','他のネットワークへ出るときの、出口（ルータ）のIPアドレス'],['切り分け','原因のありそうな場所を、順に確かめて、絞りこむこと']],
  fe:'「通信できないときの原因の切り分け」は、ネットワーク分野の定番。「ping でゲートウェイまで届く／届かない」「名前解決だけ失敗する」などの症状から、原因を選ぶ。',
  todo:[{t:'<code>ipconfig /all</code> を実行する',f:(S,c)=>bHas(S,c,'ipconfig',x=>x.all)},
        {t:'<code>ping 192.168.1.1</code>（ゲートウェイ）が<b>成功</b>する',f:(S,c)=>bHas(S,c,'ping',x=>x.dst==='192.168.1.1'&&x.ok)},
        {t:'<code>ping 198.51.100.80</code>（Webサーバ）が<b>成功</b>する',f:(S,c)=>bHas(S,c,'ping',x=>x.dst==='198.51.100.80'&&x.ok)},
        {t:'<code>tracert 198.51.100.80</code> を実行する（経路が、3つ表示される）',f:(S,c)=>bHas(S,c,'tracert',x=>x.dst==='198.51.100.80'&&x.ok)},
        {t:'<code>nslookup www.example.test</code> が<b>成功</b>する',f:(S,c)=>bHas(S,c,'nslookup',x=>x.ok)},
        {t:'<code>curl http://www.example.test</code> が<b>成功</b>する',f:(S,c)=>bCurlOk(S,c)}],
  quiz:[{q:'ネットワークの不具合の切り分けの順番として、適切なものはどれか。',opts:['自分のIP設定 → ゲートウェイ → 外部のIPアドレス → 名前解決 → アプリ','Webサーバ → DNSサーバ → ルータ → 自分のPC','ランダムに、思いついた機器から','外部のサーバから、順に自分に近づく'],ans:0,exp:'自分に近いところから、順に確かめて、止まった場所を見つけます。'},
        {q:'ping 198.51.100.80 は成功するが、curl http://www.example.test は「ホスト名を解決できませんでした」と表示された。疑う箇所として、適切なものはどれか。',opts:['DNS（名前解決）','スイッチのVLAN','ルータのデフォルトルート','LANケーブル'],ans:0,exp:'IPアドレスで届くのに、名前だけ失敗するので、名前解決（DNS）の問題です。'},
        {q:'tracert の役割として、適切なものはどれか。',opts:['宛先までの経路上のルータを、順に表示して、どこまで届くかを調べる','名前からIPアドレスを調べる','Webページを取得する','自分のIPアドレスを変更する'],ans:0,exp:'tracertは、経路をたどって、どこまで届くかを見ます。'}]},
 {title:'ケース1：「ネットが使えません」',focus:{dev:'pcA',view:'term'},
  enter:S=>{setTb(S,T=>{T.pc.gw='192.168.1.254';});},
  body:`<p>📩 <b>問い合わせ</b>：「朝から、<b>ネットが使えません</b>。会社のサイト（http://www.example.test）も、開けません。」</p>

  why:'<b>エラーの文言の違い</b>は、原因の場所を教えてくれます。「到達できません」と「タイムアウト」は、<b>誰が</b>、<b>どんな状況で</b>出すエラーでしょうか。',
  hint:['ステップ1の順番で、①から確かめます。ゲートウェイには、届きますか？','外のサーバに届かないなら、<code>tracert 198.51.100.80</code> で、どこまで届くかを見ます。エラーの文言を、よく読みます。','1つ目のルータが、「宛先ネットワークに到達できません」と報告するなら、ルータが、宛先へ送る<b>道（ルート）</b>を持っていません。ルータのタブで、<code>show ip route</code> を確認します。','1つ直しても届かないなら、症状は、「タイムアウト」に変わったはずです。<b>返事が戻れない</b>理由は、何でしょう（ミッション5）。ルータで、NAT（<code>show ip nat translations</code>、<code>show running-config</code>）を確認します。','<code>conf t</code> → <code>ip route 0.0.0.0 0.0.0.0 203.0.113.1</code> → <code>ip nat inside source list 1 interface gigabitethernet0/1 overload</code> → <code>end</code>'],
  recap:['<b>今回の原因：ルータに、デフォルトルートも、NAPTも、なかった</b>','<b>「宛先ネットワークに到達できません」</b>（ルータが報告）→ ルートがない','<b>「要求がタイムアウト」</b>→ 返事が戻れない（NAT未設定、FWなど）'],

        {q:'ルータのデフォルトルートを設定したが、外部のサーバへのpingが、「要求がタイムアウトしました」になった。次に疑う設定として、適切なものはどれか。',opts:['NAT（NAPT）の設定','PCのホスト名','スイッチのポート数','メールサーバ'],ans:0,exp:'NATがないと、プライベートIPのまま外に出てしまい、返事が戻ってこられません。'}]},

  why:'<b>どの通信が通って、どの通信が通らないか</b>を、コマンドを組み合わせて、確かめましょう。「全部だめ」か「一部だけだめ」かで、原因は、大きく絞られます。',
  hint:['ステップ1の順番で、①から確かめます。どこまで成功しますか？','ping も nslookup も成功して、curl だけ失敗するなら、<b>ポート番号ごとの</b>制限が疑われます。curl のエラーは、「拒否」ですか、「タイムアウト」ですか？','タイムアウトなら、サーバまで届く前に、途中で<b>破棄</b>されています。通信の途中にある、<b>通信を見張る機器</b>を確認します。FWのタブで、<code>iptables -L FORWARD -n --line-numbers</code>。許可されているのは、どのプロトコルとポートですか？','<code>iptables -A FORWARD -p tcp --dport 80 -j ACCEPT</code>'],
  recap:['<b>今回の原因：FWが、TCP 80（HTTP）を許可していなかった</b>','<b>pingは通るのに、curlだけタイムアウト</b> → FWが、そのポートを許可していない','<b>接続拒否</b>＝届いたが、待ち受けなし。<b>タイムアウト</b>＝途中で止められた','<code>iptables -L FORWARD -n --line-numbers</code> で、ルールと policy を確認'],
  todo:[{t:'コマンドを使って、どこで止まっているかを<b>調べる</b>（ping・nslookup・curl など）',f:(S,c)=>bHas(S,c,'ping')||bHas(S,c,'nslookup')||bHas(S,c,'curl')},

        {q:'iptablesのFORWARDで、policy が DROP のとき、どのルールにも一致しない通信は、どうなるか。',opts:['拒否される','許可される','ルールが自動で追加される','ログだけ残る'],ans:0,exp:'policy DROP は、一致するルールがないとき、拒否する、という意味です。'}]},

  why:'<b>「症状が変わったら、前進した証拠」</b>です。症状（エラーの文言）が、どう変わったかを、よく見ましょう。',
  hint:['ステップ1の順番で、①から確かめます。ipconfig /all の設定は、正常な設定値と、同じですか？','ゲートウェイ（192.168.1.1）に届きますか？ 設定が正しいのに届かないなら、<b>LANの中</b>の問題です（ミッション2・3）。PCとルータを、つないでいる機器を確認します。','スイッチのタブで、<code>show vlan brief</code>。PC-A（Fa0/1）とルータ（Fa0/2）は、同じVLANですか？','直したあと、curl の症状が、変わったはずです。「接続が拒否」されるなら、サーバまでは、届いています。Webサーバのタブで、<code>ss -tln</code> と、<code>cat /etc/nginx/conf.d/site.conf</code>。待ち受けポートを確認します。','スイッチ：<code>conf t</code> → <code>int fa0/1</code> → <code>switchport access vlan 10</code> → <code>end</code>。Web：<code>sed -i \'s/listen 8080/listen 80/\' /etc/nginx/conf.d/site.conf</code>、そのあと <code>systemctl restart nginx</code>。'],

        {q:'VLANを直したあと、curl で「接続が拒否されました」と表示された。原因として、適切なものはどれか。',opts:['サーバまで届いたが、そのポートで待ち受けているサービスがない','途中のFWが、通信を破棄している','DNSサーバが停止している','ルータにルートがない'],ans:0,exp:'拒否（RST）が返ってくるのは、サーバまで届いている証拠です。Webサーバが、80ではなく、8080で待ち受けていました。'}]},

  why:'これが、現場で行う「障害対応」そのものです。<b>順番に確かめ、止まった場所を見つけ、直して、また確かめる</b>。この繰り返しです。',
  hint:['まず、ステップ1の順番で、①ipconfig、②ping 192.168.1.1 から。','ゲートウェイにも届かないなら、スイッチ（VLAN）です。','次に、nslookup がタイムアウトするなら、DNSサーバのサービス（<code>systemctl status named</code>）を見ます。','最後に、ping も nslookup も通るのに curl がタイムアウトなら、FWです（<code>iptables -L FORWARD -n --line-numbers</code>）。'],

  quiz:[{q:'今回の不具合の原因の組み合わせとして、適切なものはどれか。',opts:['スイッチのVLAN設定の誤り／DNSサービスの停止／FWでTCP 80が許可されていない','PCのDNS設定の誤り／ルータのNAT未設定／Webサーバの設定ファイルの誤り','ルータのデフォルトルートがない／DNSのレコード誤り／スイッチの故障','MXレコードの誤り／SPFの誤り／メールサーバの停止'],ans:0,exp:'ゲートウェイに届かない（VLAN）→ 名前が引けない（DNSサービス停止）→ ページだけ開けない（FWのTCP 80）、と、症状が順に変わりました。'}]},
 {title:'まとめ問題（基本情報・科目Aスタイル）',body:`<p>ミッション9の総仕上げです。</p>`,
  past:'過去問題サイト「<a href=\"https://www.fe-siken.com/\" target=\"_blank\" rel=\"noopener\">基本情報技術者試験.com</a>」（別タブで開きます）などで、科目Aの「ネットワーク」「セキュリティ」分野の問題を探して解いてみましょう。公式の過去問題は、IPA（情報処理推進機構）も公開しています。<br><b>探すキーワード</b>：ping／tracert／nslookup／デフォルトゲートウェイ／DNS／名前解決／VLAN／NAT／ファイアウォール／ポート番号／障害の切り分け／トラブルシューティング<br>間違えた選択肢の用語は、右上の「📒 学習ノート」と見比べると定着します。<br><span class=\"small\">※ 過去問の問題文は著作権があるため、このアプリには転載していません。上のまとめ問題は、出題されやすいパターンをもとにしたオリジナル問題です。分野名や掲載ページは改定で変わることがあるので、公式サイトで確認してください。</span>',
  quiz:[{q:'あるPCから、同じLANのゲートウェイにpingが届かない。PCのIP設定は正しい。疑う箇所として、適切なものはどれか。',opts:['スイッチのポートのVLAN設定','DNSサーバのゾーン情報','Webサーバの待ち受けポート','インターネット側のFW'],ans:0,exp:'ゲートウェイにも届かないのは、LANの中の問題です。'},
        {q:'ping では外部サーバに届くが、Webブラウザに URL（ホスト名）を入力すると、「ホスト名を解決できない」というエラーになる。原因として、最も適切なものはどれか。',opts:['DNSの設定または、DNSサーバの障害','デフォルトゲートウェイの設定誤り','ルータのNATの設定誤り','スイッチのVLANの設定誤り'],ans:0,exp:'IPアドレスでは届くので、名前解決に問題があります。'},
        {q:'クライアントからサーバへ接続しようとしたところ、「接続が拒否された」と即座に表示された。原因として、適切なものはどれか。',opts:['サーバまでは届いているが、そのポートで待ち受けているサービスがない','途中のFWが、パケットを破棄している','DNSサーバが停止している','ルータにルートがない'],ans:0,exp:'即座に拒否が返るのは、サーバまで届いている証拠です。'},
        {q:'ファイアウォールで、policy がすべて拒否（DROP）、許可ルールが「TCP 443」だけのとき、クライアントから、そのサーバのTCP 80へ接続すると、どうなるか。',opts:['拒否される（タイムアウトになる）','許可される','TCP 443に自動で切り替わる','サーバが再起動する'],ans:0,exp:'どのルールにも一致しないので、policy に従い、拒否されます。FWが破棄するので、「タイムアウト」になります。'},
        {q:'プライベートIPアドレスのPCが、デフォルトルートはあるが、NAT（NAPT）を設定していないルータ経由で、インターネットのサーバにpingした。結果として、適切なものはどれか。',opts:['プライベートIPのまま送られ、返事が戻ってこない（タイムアウト）','問題なく、返事が返ってくる','ルータが、自動でNATを設定する','PCのIPアドレスが書き換わる'],ans:0,exp:'プライベートアドレスはインターネットでは使えないので、返事が戻れません。'}]}
 ]}
];
</script><script>// ===UI
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TESTAVAIL=/[?&]test=1(&|$)/.test(location.search);let TEST=false;
const KEY='netadv_v1';
const VCOL={1:'#7a8699',10:'#2f7de1',20:'#e8821a',30:'#2aa876'};
const COMING=[];
const macName=m=>{if(m===BC)return 'ブロードキャスト';for(const k in MACS)if(MACS[k]===m){const mm=/^rt(\d)$/.exec(k);return mm?'ルータ if'+mm[1]:DEVN[k];}return '';};
const clone=o=>JSON.parse(JSON.stringify(o));
let msg=null,QA={};

function fresh(){const s=freshState();s.v=3;s.cmds=[];s.term={};s.sel='pcA';s.view='cfg';s.cur={m:0,s:0};s.lastPath=[];s.pktSel=null;s.tutM={};s.cleared={};s.showDiff=false;s.net=freshNet();s.ntr=[];s.lookup=null;s.rtForm=null;s.nat=freshNat();s.gtr=[];s.tc=freshTc();s.ttr=[];s.ml=freshMl();s.mtr=[];s.sc=freshSc();s.tb=freshTb();return s;}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.dev&&j.v===3){if(!j.net)j.net=freshNet();if(!j.ntr)j.ntr=[];if(!j.nat)j.nat=freshNat();if(!j.gtr)j.gtr=[];if(!j.tc)j.tc=freshTc();if(!j.ttr)j.ttr=[];if(!j.ml)j.ml=freshMl();if(!j.mtr)j.mtr=[];if(!j.sc)j.sc=freshSc();if(!j.tb)j.tb=freshTb();if(!j.migFw){j.migFw=1;try{const tm=j.tutM&&j.tutM[7];if(tm){[0,1,2,5].forEach(k=>{if(tm.ctx)delete tm.ctx[k];if(tm.done)delete tm.done[k];['snap','snapN','snapG','snapT','snapM','snapS','snapB'].forEach(n=>{if(tm[n])delete tm[n][k];});if(tm.q)Object.keys(tm.q).forEach(x=>{if(x.indexOf(k+':')===0)delete tm.q[x];});if(tm.hint)delete tm.hint[k];});}}catch(e){}}return j;}}catch(e){}return fresh();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const TM=m=>S.tutM[m]||(S.tutM[m]={ctx:{},snap:{},done:{},q:{},hint:{}});
const MS=()=>MIS[S.cur.m].steps[S.cur.s];
const quizzesOf=st=>st.quiz?(Array.isArray(st.quiz)?st.quiz:[st.quiz]):[];
const unlocked=i=>i<MIS.length&&(i===0||TEST||S.cleared[i-1]);

// ---------- ミッション/ステップ制御 ----------
function resetLab(m){
  const f=freshState();S.dev=f.dev;S.pings=[];S.traces=[];S.views=[];S.cmds=[];S.term={};S.lastPath=[];S.pktSel=null;S.net=freshNet();S.ntr=[];S.lookup=null;S.rtForm=null;S.nat=freshNat();S.gtr=[];S.tc=freshTc();S.ttr=[];S.ml=freshMl();S.mtr=[];S.sc=freshSc();S.tb=freshTb();
  if(MIS[m].base)MIS[m].base(S);
}
function gotoMission(m,restart){
  if(m>=MIS.length)return;
  if(!S.tutM[m]||restart){S.tutM[m]=undefined;resetLab(m);TM(m);}
  let s=0;const st=MIS[m].steps;while(s<st.length-1&&TM(m).done[s])s++;
  S.cur={m,s};enterStep(m,s);renderAll();try{window.scrollTo(0,0);}catch(e){}
}
function gotoStep(s){const m=S.cur.m;S.cur.s=s;enterStep(m,s);renderAll();try{window.scrollTo(0,0);}catch(e){}}
function enterStep(m,s){
  const tm=TM(m),st=MIS[m].steps[s];
  if(!tm.ctx[s]){
    tm.ctx[s]={p0:S.pings.length,t0:S.traces.length,v0:S.views.length,c0:S.cmds.length};
    if(st.enter)st.enter(S);
    tm.snap[s]=clone(S.dev);(tm.snapN||(tm.snapN={}))[s]=clone(S.net);(tm.snapG||(tm.snapG={}))[s]=clone(S.nat);(tm.snapT||(tm.snapT={}))[s]=clone(S.tc);(tm.snapM||(tm.snapM={}))[s]=clone(S.ml);(tm.snapS||(tm.snapS={}))[s]=clone(S.sc);(tm.snapB||(tm.snapB={}))[s]=clone(S.tb);
  }
  if(st.focus){S.sel=st.focus.dev;S.view=st.focus.view;}
}
function subsOf(st,m,s){const c=TM(m).ctx[s];return (st.todo||[]).map(t=>{let ok=false;try{ok=!!t.f(S,c);}catch(e){}return {t:t.t,ok};});}
function stepDone(m,s){
  const tm=TM(m);if(tm.done[s])return true;
  const st=MIS[m].steps[s];if(!tm.ctx[s])return false;
  const so=subsOf(st,m,s).every(x=>x.ok);
  const qo=quizzesOf(st).every((q,i)=>tm.q[s+':'+i]===true);
  if(so&&qo){tm.done[s]=true;if(s===MIS[m].steps.length-1)S.cleared[m]=true;return true;}
  return false;
}
function stepAllowed(m,s){return TEST||s===0||stepDone(m,s-1);}

// ---------- 差分 ----------
function devDiff(a,b){
  const L=[],nm={ip:'IPアドレス',mask:'サブネットマスク',gw:'ゲートウェイ'};
  HOSTS.forEach(h=>['ip','mask','gw'].forEach(k=>{if(a[h][k]!==b[h][k])L.push([DEVN[h]+' の '+nm[k],a[h][k]||'(空)',b[h][k]||'(空)']);}));
  [0,1].forEach(i=>['ip','mask'].forEach(k=>{if(a.rt.ifs[i][k]!==b.rt.ifs[i][k])L.push(['ルータ if'+i+' の '+nm[k],a.rt.ifs[i][k]||'(空)',b.rt.ifs[i][k]||'(空)']);}));
  b.sw.ports.forEach((p,i)=>{const q=a.sw.ports[i];
    if(q.vlan!==p.vlan)L.push(['ポート'+p.n+'（'+DEVN[p.dev]+(p.dev==='rt'?' if'+p.ifn:'')+'）の VLAN','VLAN'+q.vlan,'VLAN'+p.vlan]);
    if(q.up!==p.up)L.push(['ポート'+p.n+'（'+DEVN[p.dev]+'）のリンク',q.up?'UP':'DOWN',p.up?'UP':'DOWN']);});
  return L;
}

// ---------- 描画：ナビ ----------
function renderNav(){
  let h='';
  for(let i=0;i<9;i++){
    const name=i<MIS.length?MIS[i].title:COMING[i-MIS.length];
    if(i<MIS.length&&unlocked(i))h+=`<button class="mn ${S.cur.m===i?'on':''} ${S.cleared[i]?'done':''}" data-act="mission" data-i="${i}">${i+1}. ${esc(name)}</button>`;
    else h+=`<button class="mn lock" disabled>${i+1}. ${esc(name)}${i<MIS.length?'':' 🔒準備中'}</button>`;
  }
  $('#mnav').innerHTML=h;
  const tb=$('#tbtn');if(TESTAVAIL){tb.style.display='';tb.textContent=TEST?'🧪 テスト：ON':'🧪 テスト';}
}

// ---------- 描画：チュートリアル ----------
function quizHtml(st,m,s){
  const tm=TM(m);
  return quizzesOf(st).map((q,i)=>{
    const key=s+':'+i,ok=tm.q[key]===true,qa=QA[m+'|'+key]||{};
    let inner='';
    if(q.type==='match'){
      inner=`<table>`+q.rows.map((r,ri)=>{
        const sel=ok?r.a:(qa.sel&&qa.sel[ri]);
        const mark=qa.checked&&!ok?(qa.sel&&qa.sel[ri]===r.a?'○':'×'):(ok?'○':'');
        return `<tr><td>${esc(r.l)}${r.h?`<div class="small">${r.h}</div>`:''}</td><td><select data-act="qsel" data-key="${key}" data-r="${ri}" ${ok?'disabled':''}><option value="">選択…</option>${q.opts.map(o=>`<option ${sel===o?'selected':''}>${esc(o)}</option>`).join('')}</select></td><td>${mark}</td></tr>`;
      }).join('')+`</table>`;
    }else{
      inner=q.opts.map((o,oi)=>`<label><input type="radio" name="q${key}" data-act="qsel" data-key="${key}" data-r="${oi}" ${ok?'disabled':''} ${(ok?q.ans===oi:qa.sel===oi)?'checked':''}> ${esc(o)}</label>`).join('');
    }
    let res='';
    if(ok)res=`<div class="res ok">⭕ 正解！ ${q.exp||''}</div>`;
    else if(qa.checked)res=`<div class="res ng">❌ もう一度考えてみよう${q.nudge?'：'+q.nudge:''}</div>`;
    return `<div class="q ${ok?'ok':''}"><div class="qq">Q${quizzesOf(st).length>1?(i+1):''} ${q.q}</div>${inner}${ok?'':`<button class="btn" data-act="qcheck" data-key="${key}" style="margin-top:6px">回答する</button>`}${res}</div>`;
  }).join('');
}
function renderTut(){
  const m=S.cur.m,s=S.cur.s,M=MIS[m],st=M.steps[s],tm=TM(m);
  const done=stepDone(m,s),subs=subsOf(st,m,s),subsOk=subs.every(x=>x.ok);
  let h=`<div class="card"><div class="mh"><h2>${M.icon||''} ミッション${m+1}：${esc(M.title)}</h2><button class="btn ghost" data-act="restart">↺ このミッションを最初から</button></div><div class="small">${esc(M.sum)}</div>`;
  const nd=M.steps.filter((x,i)=>tm.done[i]).length,tot=M.steps.length;
  h+=`<div class="prog"><div class="lbl"><span>いま <b>ステップ ${s+1}</b> ／ 全${tot}ステップ</span><span>${nd===tot?'全部クリア！':'完了 '+nd+' ／ '+tot+'（ミッションクリアまで あと'+(tot-nd)+'ステップ）'}</span></div><div class="bar"><i style="width:${Math.round(nd/tot*100)}%"></i></div>`;
  h+=`<ul class="slist">`+M.steps.map((x,i)=>{const ok=!!tm.done[i],lk=!stepAllowed(m,i);return `<li class="${i===s?'on':''} ${ok?'ok':''} ${lk&&i!==s?'lk':''}" data-act="step" data-i="${i}"><span class="n">${ok?'✓':i+1}</span>${esc(x.title)}${x.blind?' <span class="badge">チャレンジ</span>':''}</li>`;}).join('')+`</ul></div>`;
  h+=`<h3 style="font-size:16px;margin-top:0">ステップ${s+1}：${esc(st.title)}${st.blind?' <span class="badge">チャレンジ</span>':''}</h3>`;
  h+=`<div>${st.body}</div>`;
  if(st.why)h+=`<div class="box why"><b>💡 なぜ？</b> ${st.why}</div>`;
  if(st.terms)h+=`<div class="terms">`+st.terms.map(t=>`<span class="term"><b>${t[0]}</b>：${t[1]}</span>`).join('')+`</div>`;
  if(st.fe)h+=`<div class="box fe"><b class="t">📝 試験ではこう問われる</b><br>${st.fe}</div>`;
  if(st.past)h+=`<div class="box past"><b class="t">📚 本物の過去問にも挑戦しよう</b><br>${st.past}</div>`;
  if(subs.length){
    h+=`<h3>やってみよう</h3><ul class="todo">`+subs.map(x=>`<li class="${x.ok?'ok':''}">${x.t}</li>`).join('')+`</ul>`;
    h+=`<div class="tnav" style="margin-top:4px"><span>`;
    if(st.enter||st.todo)h+=`<button class="btn ghost" data-act="stepreset">↺ このステップの開始時に戻す</button> <button class="btn ghost" data-act="diff">${S.showDiff?'変更点を隠す':'🔍 変更点を見る'}</button>`;
    h+=`</span></div>`;
    if(S.showDiff){const d=isTb()?tbDiff((tm.snapB&&tm.snapB[s])||S.tb,S.tb):isSec()?scDiff((tm.snapS&&tm.snapS[s])||S.sc,S.sc):isMail()?mlDiff((tm.snapM&&tm.snapM[s])||S.ml,S.ml):isTcp()?tcDiff((tm.snapT&&tm.snapT[s])||S.tc,S.tc):isNat()?natDiff((tm.snapG&&tm.snapG[s])||S.nat,S.nat):isRoute()?netDiff((tm.snapN&&tm.snapN[s])||S.net,S.net):devDiff(tm.snap[s]||S.dev,S.dev);h+=d.length?`<table class="t" style="margin-top:6px"><tr><th>項目</th><th>開始時</th><th>現在</th></tr>${d.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table>`:`<div class="small">開始時から変更はありません。</div>`;}
    if(st.hint&&st.hint.length){
      const n=tm.hint[s]||0;
      h+=`<div style="margin-top:8px">${n?`<ol class="hints">${st.hint.slice(0,n).map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${n<st.hint.length?`<button class="btn" data-act="hint">💡 ヒント（${n}/${st.hint.length}）</button>`:''}</div>`;
    }
  }
  if(quizzesOf(st).length){
    if(subsOk||tm.done[s])h+=`<h3>確認問題</h3>`+quizHtml(st,m,s);
    else h+=`<div class="small" style="margin-top:8px">🔒 「やってみよう」を終えると確認問題が出ます。</div>`;
  }
  if(done&&st.recap)h+=`<div class="box why" style="border-color:#1d8a5c"><b>✅ ここまでのまとめ</b><ul style="margin:6px 0 0 18px;padding:0">${st.recap.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if(done&&s===M.steps.length-1){
    h+=`<div class="done-banner"><b>🎉 ミッション${m+1}クリア！</b><br>${M.clear||''}`;
    h+=m+1<MIS.length?`<br><button class="btn pri" style="margin-top:6px" data-act="mission" data-i="${m+1}">次のミッションへ →</button>`:`<br><span class="small">${COMING.length?'このあとのミッション（'+COMING.join('・')+'）は、ここまでを試してもらってから続けて作ります。':'🎓 全9ミッションを、やりきりました！おつかれさまでした。'}</span>`;
    h+=`</div>`;
  }
  h+=`<div class="tnav"><button class="btn" data-act="prev" ${s===0?'disabled':''}>← 前へ</button><button class="btn pri" data-act="next" ${(s>=M.steps.length-1||!(done||TEST))?'disabled':''}>次のステップ →</button></div></div>`;
  $('#tut').innerHTML=h;
}

// ---------- 描画：構成図 ----------
const POS={pcA:[80,50],pcB:[80,150],pcC:[80,250],srv:[620,50],rt:[620,250]};
const PORTPT={1:[290,100],2:[290,150],3:[290,200],4:[410,100],5:[410,190],6:[410,230]};
function devEnd(p){
  if(p.dev==='rt')return [560,p.ifn===0?228:268];
  const [x,y]=POS[p.dev];return [x<350?x+60:x-60,y];
}
const isRoute=()=>!!MIS[S.cur.m]&&MIS[S.cur.m].lab==='route';
const isNat=()=>!!MIS[S.cur.m]&&MIS[S.cur.m].lab==='nat';
const isTcp=()=>!!MIS[S.cur.m]&&MIS[S.cur.m].lab==='tcp';
const isMail=()=>!!MIS[S.cur.m]&&MIS[S.cur.m].lab==='mail';
const isSec=()=>!!MIS[S.cur.m]&&MIS[S.cur.m].lab==='sec';
const isTb=()=>!!MIS[S.cur.m]&&MIS[S.cur.m].lab==='tb';
function renderDiag(){
  if(isTb())return renderTbDiag();
  if(isSec())return renderSDiag();
  if(isMail())return renderMDiag();
  if(isTcp())return renderTDiag();
  if(isNat())return renderGDiag();
  if(isRoute())return renderNDiag();
  const blind=!!(MS().blind&&!stepDone(S.cur.m,S.cur.s)),D=S.dev,hl=new Set(S.lastPath||[]);
  let g='',cir='';
  D.sw.ports.forEach(p=>{
    const a=PORTPT[p.n],b=devEnd(p),col=blind?'#7a8699':(VCOL[p.vlan]||'#999');
    if(hl.has(p.n))g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#ffd43b" stroke-width="11" opacity=".75" stroke-linecap="round"/>`;
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${p.up?col:'#d63031'}" stroke-width="4" ${p.up?'':'stroke-dasharray="6 5"'}/>`;
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    if(!p.up)g+=`<text x="${mx}" y="${my+5}" text-anchor="middle" font-size="16" fill="#d63031">✕</text>`;
    else if(!blind)g+=`<text x="${mx}" y="${my-6}" text-anchor="middle" font-size="11" fill="${col}" font-weight="700">VLAN${p.vlan}</text>`;
    cir+=`<circle cx="${a[0]}" cy="${a[1]}" r="11" fill="#14213d" stroke="#fff" stroke-width="2"/><text x="${a[0]}" y="${a[1]+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${p.n}</text>`;
  });
  const swg=`<g data-act="seldev" data-dev="sw" style="cursor:pointer"><rect x="290" y="70" width="120" height="190" rx="10" fill="#e8efff" stroke="${S.sel==='sw'?'#2f5fd0':'#8aa0d6'}" stroke-width="${S.sel==='sw'?4:2}"/><text x="350" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#14213d">L2スイッチ</text><text x="350" y="180" text-anchor="middle" font-size="11" fill="#5b6577">ポート1〜6</text></g>`;
  g=swg+g+cir;
  const box=(dev)=>{
    const [x,y]=POS[dev],sel=S.sel===dev;let lines;
    if(dev==='rt')lines=[D.rt.ifs[0].ip||'(if0 未設定)',D.rt.ifs[1].ip||'(if1 未設定)'];else lines=[D.dev?'':'',D[dev].ip||'(IP未設定)'];
    const w=120,hh=dev==='rt'?72:56;
    let s=`<g data-act="seldev" data-dev="${dev}" style="cursor:pointer"><rect x="${x-60}" y="${y-(dev==='rt'?36:28)}" width="${w}" height="${hh}" rx="8" fill="#fff" stroke="${sel?'#2f5fd0':'#8aa0d6'}" stroke-width="${sel?4:2}"/>`;
    s+=`<text x="${x}" y="${y-(dev==='rt'?16:6)}" text-anchor="middle" font-size="14" font-weight="700">${dev==='rt'?'🔀 ':(dev==='srv'?'🖥 ':'💻 ')}${DEVN[dev]}</text>`;
    if(dev==='rt'){s+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="#444">${esc(lines[0])}</text><text x="${x}" y="${y+22}" text-anchor="middle" font-size="11" fill="#444">${esc(lines[1])}</text>`;}

function swView(){

function pktView(){
  if(isMail())return mFlowView();

  if(!S.traces.length)return `<div class="small">まだpingしていません。ターミナルから ping を実行すると、直前のpingで流れたフレームが順番に表示されます（最初の1回分）。</div>`;

  tr.events.forEach(e=>{h+=`<tr class="clk ${S.pktSel&&S.pktSel.tid===tid&&S.pktSel.seq===e.seq?'sel':''}" data-act="evsel" data-tid="${tid}" data-seq="${e.seq}"><td>${e.seq}</td><td>${e.kind}</td><td>${esc(macName(e.l2src))}→${esc(macName(e.l2dst))}</td><td class="mono">${e.sip}→${e.dip}</td><td>${e.ttl==null?'-':e.ttl}</td><td>${e.lost?'<span style="color:#c0392b">届かない</span>':esc(e.mode.split('（')[0])+'（ポート'+e.ports.join(',')+'）'}</td></tr>`;});
  h+=`</table><div class="small">行をクリックすると、そのフレームの中身（カプセル化の様子）が見えます。</div>`;
  if(S.pktSel&&S.pktSel.tid===tid){const e=tr.events.find(x=>x.seq===S.pktSel.seq);if(e)h+=evDetail(e);}

function mc(m){const n=macName(m);return `<span class="mono">${m}</span>${n?'（'+n+'）':''}`;}
function evDetail(e){
  let h=`<h3>フレーム #${e.seq}：${e.kind}</h3>`;
  const l2=`<div class="kv"><span>宛先MACアドレス</span><span>${mc(e.l2dst)}</span><span>送信元MACアドレス</span><span>${mc(e.l2src)}</span><span>タイプ</span><span>${e.kind.startsWith('ARP')?'0x0806（ARP）':'0x0800（IPv4）'}</span></div>`;
  if(e.kind.startsWith('ARP')){
    h+=`<div class="enc l2"><b>第2層 データリンク層｜イーサネットフレーム</b>${l2}<div class="enc arp"><b>ARPメッセージ（IPパケットではなく、フレームに直接のる）</b><div class="kv"><span>操作</span><span>${e.kind==='ARP要求'?'要求（1）':'応答（2）'}</span><span>送信元IP</span><span class="mono">${e.sip}</span><span>目的IP</span><span class="mono">${e.dip}</span><span>意味</span><span>${esc(e.arpText)}</span></div></div></div>`;
  }else{
    const req=e.kind==='ICMPエコー要求';
    h+=`<div class="enc l2"><b>第2層 データリンク層｜イーサネットフレーム</b>${l2}<div class="enc l3"><b>第3層 ネットワーク層｜IPパケット</b><div class="kv"><span>送信元IPアドレス</span><span class="mono">${e.sip}</span><span>宛先IPアドレス</span><span class="mono">${e.dip}</span><span>TTL</span><span>${e.ttl}</span><span>プロトコル</span><span>ICMP（1）</span></div><div class="enc l4"><b>ICMPメッセージ（ping）</b><div class="kv"><span>タイプ</span><span>${req?'8（エコー要求）':'0（エコー応答）'}</span><span>データ</span><span>32バイト</span></div></div></div></div>`;
  }
  h+=`<div class="small">第1層（物理層）では、このフレーム全体が電気信号のビット列としてケーブルを流れます。</div>`;
  h+=e.lost?`<div class="err">${esc(e.lost)}</div>`:`<div class="box why"><b>スイッチの動作</b>：入力ポート ${e.inPort}（VLAN${e.vlan}）→ ${esc(e.mode)} → 出力ポート ${e.ports.join('、')}（${e.to.map(d=>DEVN[d]).join('、')}）</div>`;
  return h;
}

function openNotes(){
  let h=`<div class="modal" data-act="closemodal"><div class="in" onclick="event.stopPropagation()"><div class="mh"><h2>📒 学習ノート</h2><button class="btn" data-act="closemodal">閉じる</button></div>`;
  let any=false;
  MIS.forEach((M,m)=>{
    const tm=S.tutM[m];if(!tm)return;
    const terms=[];M.steps.forEach((st,i)=>{if(tm.done[i]&&st.terms)st.terms.forEach(t=>terms.push(t));});
    if(!terms.length&&!S.cleared[m])return;any=true;
    h+=`<h3>ミッション${m+1}：${esc(M.title)} ${S.cleared[m]?'✅':''}</h3>`;
    if(S.cleared[m]&&M.note)h+=`<ul>${M.note.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(terms.length)h+=`<div class="terms">${terms.map(t=>`<span class="term"><b>${t[0]}</b>：${t[1]}</span>`).join('')}</div>`;
  });
  if(!any)h+=`<p class="small">ステップをクリアすると、ここに用語とまとめがたまっていきます。</p>`;
  $('#modal').innerHTML=h+`</div></div>`;
}

  });
  const box=d=>{

function runTCmd(dev,line){

  const a=line.trim().split(/\s+/).filter(Boolean),c=(a[0]||'').toLowerCase();let out=[];const rec={dev,cmd:c};

  else if(dev!=='pcA')out=['この機器では、コマンドは使えません。PC-Aのターミナルを使ってください。'];
  else if(c==='curl'){const r=runTCurl(S,a[1]);out=r.lines;if(r.meta){Object.assign(rec,{dst:r.meta.dst,port:r.meta.port,ok:r.meta.ok,kind:r.meta.kind,retx:r.meta.retx,appRetx:r.meta.appRetx,lost:r.meta.lost,lossN:r.meta.lossN,lossAll:r.meta.lossAll,webState:r.meta.webState,webPort:r.meta.webPort,proto:'tcp'});logTPing(r.meta,'curl');S.pktSel=null;}}
  else if(c==='nslookup'){const r=runTNslookup(S,a[1]);out=r.lines;if(r.meta){Object.assign(rec,{dst:r.meta.dst,ok:r.meta.ok,kind:r.meta.kind,appRetx:r.meta.appRetx,lost:r.meta.lost,lossN:r.meta.lossN,lossAll:r.meta.lossAll,dnsUp:r.meta.dnsUp,proto:'udp'});logTPing(r.meta,'nslookup');S.pktSel=null;}}
  else if(c==='netstat')out=runTNetstat(S);
  else out=['\''+a[0]+'\' は、内部コマンドまたは外部コマンド、操作可能なプログラムまたはバッチ ファイルとして認識されていません。'];
  out.forEach(x=>t.push(x));if(t.length>400)t.splice(0,t.length-400);
  S.cmds.push(rec);
}

function runMCmd(dev,line){
  const t=S.term[dev]||(S.term[dev]=[]);
  t.push('C:\\Users\\user>'+line);
  if(line.trim()){const hh=(S.hist||(S.hist={}))[dev]||(S.hist[dev]=[]);hh.push(line.trim());if(hh.length>50)hh.shift();}
  const a=line.trim().split(/\s+/).filter(Boolean),c=(a[0]||'').toLowerCase();let out=[];const rec={dev,cmd:c};
  if(!c){}
  else if(c==='cls'){S.term[dev]=[];S.cmds.push(rec);return;}
  else if(dev!=='pcA')out=['この機器では、コマンドは使えません。PC-Aのターミナルを使ってください。'];
  else if(c==='nslookup'){const r=runMNslookup(S,a.slice(1));out=r.lines;if(r.meta){Object.assign(rec,{type:r.meta.type,name:r.meta.name,ok:r.meta.ok});logMTr('dns','nslookup '+(r.meta.type!=='A'?'-type='+r.meta.type+' ':'')+r.meta.name,r.meta.ev,['pcA','dns']);}}
  else out=['\''+a[0]+'\' は、内部コマンドまたは外部コマンド、操作可能なプログラムまたはバッチ ファイルとして認識されていません。'];
  out.forEach(x=>t.push(x));if(t.length>400)t.splice(0,t.length-400);
  S.cmds.push(rec);
}
function mlClick(a,el){
  const M=S.ml;
  if(a==='mlfrom'){const q=$('#ml-subj');if(q)M.subj=q.value;M.from=el.dataset.v;msg=null;refresh();return;}
  if(a==='mlsend'){
    const q=$('#ml-subj'),subj=((q&&q.value)||'').trim()||'（件名なし）';M.subj='';
    const r=mlSend(S,subj);
    logMTr('send','メール送信「'+subj+'」'+(r.spoof?'（なりすまし）':''),r.ev,['pcA','mta','dns','rcv'],{via:r.via});
    S.cmds.push({dev:'pcA',cmd:'mlsend',ok:r.ok,status:r.status,via:r.via,backup:!!r.backup,spf:r.spf,spoof:!!r.spoof,spfOn:!!M.rcv.spf});

    msg=r.ok?{ok:1,t:T[r.status],html:1}:{t:T[r.status],html:1};
    refresh();return;
  }
  if(a==='mlrecv'){
    const d=el.dataset.dev,r=mlRecv(S,d);
    logMTr('recv',(d==='pcB'?'PC-B':'スマホ-B')+'が受信（'+(r.proto==='pop3'?'POP3':'IMAP')+'）',r.ev,['dev','rcv'],{devId:d});
    S.cmds.push({dev:d,cmd:'mlrecv',proto:r.proto,n:r.n,shown:M.dev[d].local.length,left:M.mbox.length});
    msg={ok:1,t:'受信しました。サーバのメールは '+r.n+'通。いま表示されているメールは '+M.dev[d].local.length+'通です。'+(r.proto==='pop3'&&r.n?'（POP3：サーバからは削除されました）':'')};
    refresh();return;
  }
  if(a==='mlq'){runMCmd('pcA',el.dataset.c);msg=null;refresh();return;}
  if(a==='mlproto'){const d=el.dataset.dev;M.dev[d].proto=el.dataset.v;S.cmds.push({dev:d,cmd:'mlproto',proto:el.dataset.v});msg=null;refresh();return;}
  if(a==='mlup'){const h=el.dataset.h;M.rcv.up[h]=!M.rcv.up[h];S.cmds.push({dev:'rcv',cmd:'mlup',host:h,up:M.rcv.up[h]});msg=null;refresh();return;}
  if(a==='mlspf'){M.rcv.spf=!M.rcv.spf;S.cmds.push({dev:'rcv',cmd:'mlspf',on:M.rcv.spf});msg=null;refresh();return;}
  if(a==='mlzadd'){
    const v=id=>{const q=$('#'+id);return q?q.value:'';};
    const p=mlZoneAdd(S,v('mz-t'),v('mz-n'),v('mz-v'),v('mz-p'));
    if(!p)S.cmds.push({dev:'dns',cmd:'zoneadd',t:v('mz-t'),n:v('mz-n').trim().toLowerCase(),v:v('mz-v').trim().toLowerCase()});
    msg=p?{t:p}:{ok:1,t:'レコードを追加しました'};refresh();return;
  }
  if(a==='mlzdel'){const i=+el.dataset.i,r=M.zone[i];if(r){M.zone.splice(i,1);S.cmds.push({dev:'dns',cmd:'zonedel',t:r.t,n:r.n,v:r.v});msg={ok:1,t:'レコードを削除しました'};}refresh();return;}
}

  ev.forEach((e,i)=>{

function runCmd(dev,line){

  if(isTcp())return runTCmd(dev,line);

  if(!c){}

  else if(c==='ipconfig'&&dev!=='rt')out=runIpconfig(S,dev,a.slice(1));

function applyHost(dev){
  const v=id=>($('#'+id).value||'').trim(),ip=v('cf-ip'),mask=v('cf-mask'),gw=v('cf-gw');let p='';
  if(ip2n(ip)===null)p='IPアドレスの形式が正しくありません（例：192.168.1.11）';
  else if(!maskOk(mask))p='サブネットマスクが正しくありません（例：255.255.255.0）';
  else if(gw&&ip2n(gw)===null)p='ゲートウェイの形式が正しくありません';
  else p=addrProblem(ip,mask,'IPアドレス')||gwProblem(ip,mask,gw);
  if(p){msg={t:p};return false;}
  const d=S.dev[dev];d.ip=ip;d.mask=mask;d.gw=gw;clearCaches(S);msg={ok:1,t:DEVN[dev]+' の設定を反映しました'};return true;
}
function applyRt(){
  const v=id=>($('#'+id).value||'').trim(),n=[];let p='';
  for(let i=0;i<2;i++){const ip=v('rf'+i+'-ip'),mask=v('rf'+i+'-mask');
    if(ip===''){n.push({ip:'',mask});continue;}
    if(ip2n(ip)===null){p='if'+i+' のIPアドレスの形式が正しくありません';break;}
    if(!maskOk(mask)){p='if'+i+' のサブネットマスクが正しくありません';break;}
    p=addrProblem(ip,mask,'if'+i+' のIPアドレス');if(p)break;n.push({ip,mask});}
  if(!p&&validIf(n[0])&&validIf(n[1])&&sameNet(n[0].ip,n[1].ip,n[0].mask))p='if0 と if1 を同じネットワークに設定することはできません（ルータは“別のネットワーク同士をつなぐ”装置です）';
  if(p){msg={t:p};return false;}
  S.dev.rt.ifs=n;clearCaches(S);msg={ok:1,t:'ルータの設定を反映しました'};return true;
}

// ---------- イベント ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='qsel'||a==='vlan'||a==='trsel')return;
  const m=S.cur.m,s=S.cur.s;
  if(a==='mission'){const i=+el.dataset.i;if(unlocked(i)){$('#modal').innerHTML='';msg=null;gotoMission(i);}}
  else if(a==='step'){const i=+el.dataset.i;if(stepAllowed(m,i)){msg=null;gotoStep(i);}}
  else if(a==='prev'){if(s>0){msg=null;gotoStep(s-1);}}
  else if(a==='next'){if(stepDone(m,s)||TEST){msg=null;gotoStep(Math.min(s+1,MIS[m].steps.length-1));}}
  else if(a==='restart'){if(confirm('このミッションを最初からやり直しますか？（機器の設定も初期化されます）')){msg=null;QA={};gotoMission(m,true);}}
  else if(a==='hint'){const tm=TM(m);tm.hint[s]=(tm.hint[s]||0)+1;renderTut();save();}
  else if(a==='diff'){S.showDiff=!S.showDiff;renderTut();}
  else if(a==='stepreset'){const tm=TM(m);if(tm.snap[s]){S.dev=clone(tm.snap[s]);if(tm.snapN&&tm.snapN[s])S.net=clone(tm.snapN[s]);if(tm.snapG&&tm.snapG[s])S.nat=clone(tm.snapG[s]);if(tm.snapT&&tm.snapT[s])S.tc=clone(tm.snapT[s]);if(tm.snapM&&tm.snapM[s])S.ml=clone(tm.snapM[s]);if(tm.snapS&&tm.snapS[s])S.sc=clone(tm.snapS[s]);if(tm.snapB&&tm.snapB[s])S.tb=clone(tm.snapB[s]);S.lastPath=[];msg={ok:1,t:'このステップを始めたときの状態に戻しました'};refresh();}}
  else if(a==='qcheck'){
    const key=el.dataset.key,qi=+key.split(':')[1],q=quizzesOf(MS())[qi],qa=QA[S.cur.m+'|'+key]||(QA[S.cur.m+'|'+key]={});qa.checked=true;
    let ok=false;
    if(q.type==='match')ok=!!qa.sel&&q.rows.every((r,i)=>qa.sel[i]===r.a);else ok=qa.sel===q.ans;
    if(ok){TM(m).q[key]=true;}
    stepDone(m,s);renderTut();renderDiag();save();
  }
  else if(a==='seldev'){S.sel=el.dataset.dev;msg=null;renderDiag();renderDevice();if(isMail()||isSec()||isTb())renderTut();save();}
  else if(a==='setview'){S.view=el.dataset.v;msg=null;S.views.push(S.view==='sw'?'sw':(S.view==='pkt'?'pkt':'v:'+S.view));renderDevice();renderTut();save();}
  else if(a==='applyhost'){applyHost(S.sel);refresh();}
  else if(a==='applyrt'){applyRt();refresh();}
  else if(a==='tbtpl'){const i=$('#tin');if(i){i.value=el.dataset.t;i.focus();}}
  else if(a==='termfocus'){const i=$('#tin');if(i&&window.getSelection().toString()==='')i.focus();}
  else if(a==='link'){const p=S.dev.sw.ports.find(q=>q.n===+el.dataset.n);p.up=!p.up;dropPort(p.n);clearCaches(S);S.lastPath=[];refresh();}
  else if(a==='macclear'){S.dev.sw.mac={};refresh();}
  else if(a==='evsel'){const tid=+el.dataset.tid,seq=+el.dataset.seq;S.pktSel={tid,seq};const tr=S.traces.find(t=>t.id===tid),ev=tr&&tr.events.find(x=>x.seq===seq);if(ev)S.views.push('ev:'+ev.kind+':'+ev.from);refresh();}
  else if(a==='natmode'){S.nat.mode=el.dataset.m;msg={ok:1,t:S.nat.mode==='napt'?'NAPTを有効にしました':'NAPTを無効にしました'};refresh();}
  else if(a==='addstatic')doAddStatic();
  else if(a==='delstatic'){S.nat.statics.splice(+el.dataset.i,1);msg={ok:1,t:'静的NATを削除しました'};refresh();}
  else if(a==='addfwd')doAddFwd();
  else if(a==='delfwd'){S.nat.fwd.splice(+el.dataset.i,1);msg={ok:1,t:'ポートフォワーディングを削除しました'};refresh();}
  else if(a==='clrnat'){S.nat.tbl=[];msg=null;refresh();}
  else if(a==='tcweb'){S.tc.web.state=el.dataset.v;msg={ok:1,t:'Webサーバの状態を変更しました'};refresh();}
  else if(a==='tcport'){const v=+($('#tc-port').value||'').trim();if(v>=1&&v<=65535){S.tc.web.port=v;msg={ok:1,t:'待ち受けポートを '+v+' に変更しました'};}else msg={t:'ポート番号は 1〜65535 の数字で入力してください'};refresh();}
  else if(a==='tcdns'){S.tc.dns.up=!S.tc.dns.up;refresh();}
  else if(a==='tcloss'){const v=parseInt(($('#tc-loss').value||'').trim(),10);if(v>=0&&v<=60){S.tc.loss.n=v;S.tc.loss.all=false;msg={ok:1,t:v?v+'番目のパケットを失わせます':'パケットロスなしにしました'};}else msg={t:'0〜60の数字で入力してください'};refresh();}
  else if(a==='tcall'){S.tc.loss.all=!S.tc.loss.all;if(S.tc.loss.all)S.tc.loss.n=0;msg=null;refresh();}
  else if(a==='tcnoloss'){S.tc.loss={n:0,all:false};msg=null;refresh();}
  else if(SACTS.has(a))scClick(a,el);
  else if(MACTS.has(a))mlClick(a,el);
  else if(a==='addroute')doAddRoute();
  else if(a==='delroute'){S.net.routers[S.sel].routes.splice(+el.dataset.i,1);msg={ok:1,t:'ルートを削除しました'};refresh();}
  else if(a==='lookup')doLookup();
  else if(a==='notes')openNotes();
  else if(a==='closemodal'){if(e.target===el||el.tagName==='BUTTON')$('#modal').innerHTML='';}
  else if(a==='testtoggle'){TEST=!TEST;renderAll();}
});
function dropPort(n){const mac=S.dev.sw.mac;Object.keys(mac).forEach(k=>{if(mac[k]===n)delete mac[k];});}
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='qsel'){const key=el.dataset.key,q=quizzesOf(MS())[+key.split(':')[1]],qa=QA[S.cur.m+'|'+key]||(QA[S.cur.m+'|'+key]={});
    if(q.type==='match'){qa.sel=qa.sel||{};qa.sel[+el.dataset.r]=el.value;}else qa.sel=+el.dataset.r;qa.checked=false;}
  else if(a==='vlan'){const p=S.dev.sw.ports.find(q=>q.n===+el.dataset.n);p.vlan=+el.value;dropPort(p.n);clearCaches(S);S.lastPath=[];refresh();}
  else if(a==='trsel'){S.pktSel={tid:+el.value,seq:0};renderDevice();}
});
let HI=-1;
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.target.id==='sn-in'||e.target.id==='sn-out')){doAddStatic();return;}
  if(e.key==='Enter'&&(e.target.id==='pf-gp'||e.target.id==='pf-ip'||e.target.id==='pf-port')){doAddFwd();return;}
  if(e.key==='Enter'&&e.target.id==='tc-loss'){document.querySelector('[data-act="tcloss"]').click();return;}
  if(e.key==='Enter'&&e.target.id==='tc-port'){document.querySelector('[data-act="tcport"]').click();return;}
  if(e.key==='Enter'&&e.target.id==='ml-subj'){document.querySelector('[data-act="mlsend"]').click();return;}
  if(e.key==='Enter'&&(e.target.id==='mz-n'||e.target.id==='mz-v'||e.target.id==='mz-p')){document.querySelector('[data-act="mlzadd"]').click();return;}
  if(e.key==='Enter'&&e.target.id==='lk-ip'){doLookup();return;}
  if(e.key==='Enter'&&(e.target.id==='rt-nh'||e.target.id==='rt-net')){doAddRoute();return;}
  if(e.target.id!=='tin')return;
  const h=(S.hist&&S.hist[S.sel])||[];
  if(e.key==='Enter'){HI=-1;runCmd(S.sel,e.target.value);msg=null;refresh();}
  else if(e.key==='ArrowUp'){e.preventDefault();if(h.length){HI=HI<0?h.length-1:Math.max(0,HI-1);e.target.value=h[HI];}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(HI>=0){HI++;if(HI>=h.length){HI=-1;e.target.value='';}else e.target.value=h[HI];}}
});

// 起動
(function(){
  if(!MIS[S.cur.m]||!S.tutM[S.cur.m]){S.cur={m:0,s:0};gotoMission(0);return;}
  enterStep(S.cur.m,S.cur.s);renderAll();
})();
</script>
</body></html>
